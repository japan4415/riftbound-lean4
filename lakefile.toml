name = "riftbound"
version = "0.1.0"
# axiom の監査（lake check）はデフォルトのビルド対象を見る。検証コアだけを対象にする。
defaultTargets = ["Riftbound"]
testDriver = "RiftboundTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.missingDocs = true

[[require]]
name = "plausible"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "Riftbound"          # 検証コア（P8 の禁止事項と axiom 監査の対象）

[[lean_lib]]
name = "RiftboundCards"     # カード定義と具体的な CardDB

[[lean_lib]]
name = "RiftboundDriver"    # 乱数の供給・自動対戦・ログ再生（IO を使う。監査の対象外）

[[lean_lib]]
name = "RiftboundTest"

[[lean_exe]]
name = "riftbound-trace"    # 1 ゲームを JSON のトレースにして書き出す（viewer/ が再生する）
root = "RiftboundTrace"

[[lean_exe]]
name = "riftbound-match"    # デモのゲームで Best of 3 のマッチを行い、結果を出力する
root = "RiftboundMatch"

[[lean_exe]]
name = "riftbound-live"    # ビューアから答えを選んで進めるゲーム（標準入出力で JSON を返す）
root = "RiftboundLive"

[[lean_exe]]
name = "riftbound-replay"  # マッチを入力から再実行し、記録・照合する
root = "RiftboundReplay"
