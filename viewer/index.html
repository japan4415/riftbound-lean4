<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound トレースビューア</title>
<style>
:root {
  --bg: #f6f5f2; --fg: #1d2126; --muted: #626b75; --panel: #ffffff; --line: #d9d6cf;
  --felt: #e9ece6; --accent: #2b5f8c; --card: #fdfdfb; --card-line: #b9b5ab;
  --fury: #c4452f; --calm: #2f87ab; --mind: #7d5bb8; --body: #4b9348; --chaos: #c9822a; --order: #b49c2c;
  --font: "Inter", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ch: clamp(50px, 9.2vh, 88px); --cw: calc(var(--ch) * .74);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171a; --fg: #e5e8ea; --muted: #97a1ab; --panel: #1c2024; --line: #333940;
  --felt: #1a2420; --accent: #7db4e0; --card: #272c31; --card-line: #4a525a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14171a; --fg: #e5e8ea; --muted: #97a1ab; --panel: #1c2024; --line: #333940;
  --felt: #1a2420; --accent: #7db4e0; --card: #272c31; --card-line: #4a525a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font);
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px)); }
/* 1 画面に収める: 縦に並べ、盤面（.layout）が余りを使い、足りなければ盤面の中だけが動く */
.app { margin: 0 auto; display: flex; flex-direction: column; gap: 6px;
  height: calc(100dvh - 16px); min-height: 520px; }
.app > * { flex: none; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font-size: 1rem; margin: 0; }
.status { color: var(--muted); font-variant-numeric: tabular-nums; }
.phases { display: flex; flex-wrap: wrap; gap: 4px; }
.phase { padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted);
  font-size: .74rem; transition: background .2s, color .2s; }
.phase.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.layout { flex: 1 1 0 !important; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 8px; align-items: stretch; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .app { height: auto; } }
.board { display: grid; gap: 6px; min-height: 0; overflow: auto; align-content: start; }
.midrow { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 6px; }
.seat { background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px;
  display: grid; grid-template-columns: 78px minmax(0, 1fr) minmax(0, 1.3fr); gap: 4px 6px; transition: box-shadow .25s, border-color .25s; }
.seat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.seat-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.seat-head h2 { font-size: .95rem; margin: 0; }
.pts { font-variant-numeric: tabular-nums; color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 1px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line);
  font-size: .82rem; font-variant-numeric: tabular-nums; }
.chip.energy { border-color: var(--accent); }
.chip.pop { animation: pop .45s ease; }
@keyframes pop { 40% { transform: scale(1.25); background: var(--accent); color: var(--bg); } }
.piles { display: flex; flex-wrap: wrap; gap: 3px 5px; margin-left: auto; }
.pile { display: flex; align-items: baseline; gap: 4px; border: 1px dashed var(--card-line); border-radius: 6px;
  padding: 0 6px; font-size: .68rem; color: var(--muted); }
.pile b { font-size: .85rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.pile.zero { opacity: .45; }
.lane { min-height: calc(var(--ch) + 18px); border-radius: 6px; padding: 14px 4px 4px; position: relative;
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; background: color-mix(in srgb, var(--panel) 55%, transparent); }
.lane::before { content: attr(data-label); position: absolute; top: 2px; left: 8px; font-size: .7rem;
  color: var(--muted); letter-spacing: .04em; }
.lane > .grp { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; position: relative; }
.lane > .grp:empty { display: none; }
.lane > .grp.runes { padding: 12px 4px 3px; border: 1px dashed var(--card-line); border-radius: 6px; }
.lane > .grp.runes::before { content: attr(data-label); position: absolute; top: 0; left: 6px; font-size: .62rem; color: var(--muted); }
.lane.bfs { background: transparent; padding: 14px 0 0; gap: 6px; }
.bf { flex: 1 1 160px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px 5px;
  background: color-mix(in srgb, var(--panel) 55%, transparent); transition: border-color .25s, box-shadow .25s; }
.bf.mine0 { border-color: var(--accent); } .bf.mine1 { border-color: var(--chaos); }
.bf.contested { box-shadow: 0 0 0 2px var(--fury) inset; }
.bf-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: .78rem; margin-bottom: 6px; }
.bf-cards { display: flex; flex-wrap: wrap; gap: 6px; min-height: var(--ch); }
.tag { padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); font-size: .72rem; color: var(--muted); }
.tag.ctl0 { border-color: var(--accent); color: var(--accent); }
.tag.ctl1 { border-color: var(--chaos); color: var(--chaos); }
.tag.hot { border-color: var(--fury); color: var(--fury); }
.card.bfcard .card-in { border-style: double; border-width: 3px; }
.card .bst { position: absolute; left: 3px; top: 3px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--accent); color: #fff; }
.card .stn { position: absolute; left: 3px; top: 20px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--chaos, #7a4fa0); color: #fff; }
.card .eqp { position: absolute; right: 3px; bottom: 3px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--calm, #2c5f8a); color: #fff; }
.card.ability .card-in { border-style: dashed; border-width: 2px; }
.card .ab { position: absolute; left: 4px; bottom: 3px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--fury); color: #fff; }
.card { width: var(--cw); height: var(--ch); position: relative; }
.card-in { width: 100%; height: 100%; border: 1px solid var(--card-line); border-radius: 5px; background: var(--card);
  padding: 2px 3px; font-size: .64rem; line-height: 1.2; overflow: hidden; display: flex; flex-direction: column;
  justify-content: space-between; transition: transform .3s ease, opacity .3s; }
.card-in.exh { transform: rotate(90deg) scale(.82); opacity: .6; }
.card .nm { font-weight: 600; overflow-wrap: anywhere; }
.card .st { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
.card.rune .card-in { border-width: 2px; }
.card.rune .nm { text-align: center; margin-block: auto; }
.card .dmg { position: absolute; right: -4px; top: -4px; background: var(--fury); color: #fff; border-radius: 99px;
  padding: 0 5px; font-size: .65rem; }
.d-fury { border-color: var(--fury) !important; } .d-calm { border-color: var(--calm) !important; }
.d-mind { border-color: var(--mind) !important; } .d-body { border-color: var(--body) !important; }
.d-chaos { border-color: var(--chaos) !important; } .d-order { border-color: var(--order) !important; }
.side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 0; }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-height: 24dvh; overflow: auto; }
.now b { display: block; margin-bottom: 2px; }
.now small { color: var(--muted); }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 0; overflow-y: auto;
  margin: 0; padding: 4px; list-style: none; }
.log li { padding: 1px 8px; border-radius: 5px; cursor: pointer; font-size: .74rem; color: var(--muted); }
.log li:hover { background: var(--bg); }
.log li.cur { background: var(--accent); color: var(--bg); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; }
button, select { font: inherit; font-size: .8rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#scrub { flex: 1 1 200px; min-width: 120px; }
.banner { background: var(--accent); color: var(--bg); padding: 2px 12px; border-radius: 8px; font-weight: 600; }
#fly { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 8px; }
[hidden] { display: none !important; }
.note { color: var(--muted); font-size: .74rem; }
#cardinfo { position: fixed; z-index: 60; width: 330px; max-height: min(82dvh, 580px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .4); font-size: .8rem; }
#cardinfo h2 { margin: 0; font-size: 1rem; }
#cardinfo .sub { color: var(--muted); margin-bottom: 4px; }
#cardinfo dl { display: grid; grid-template-columns: 5.2em 1fr; gap: 2px 8px; margin: 6px 0; }
#cardinfo dt { color: var(--muted); } #cardinfo dd { margin: 0; }
#cardinfo pre { margin: 6px 0 0; padding: 6px; background: var(--bg); border-radius: 6px; font: .68rem/1.35 var(--mono);
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
#cardinfo .x { float: right; padding: 0 7px; }
.card { cursor: context-menu; }
.tgt { cursor: pointer; outline: 2px dashed var(--accent); outline-offset: 2px; background-clip: padding-box; }
.tgt:hover, .tgt:focus-visible { outline-style: solid; outline-width: 3px; }
.bf.tgt, .lane.tgt { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.card.act { cursor: pointer; outline: 2px solid var(--accent); outline-offset: 1px; }
.card.act:hover, .card.act:focus-visible { outline-width: 3px; transform: translateY(-3px); }
#actmenu { position: fixed; z-index: 65; display: grid; gap: 3px; padding: 6px; max-width: min(360px, 92vw);
  max-height: min(70dvh, 480px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, .4); font-size: .8rem; }
#actmenu h3 { margin: 0 2px 2px; font-size: .72rem; color: var(--muted); font-weight: 600; }
#actmenu button { text-align: left; }
.card-in { position: relative; }
.card-in > .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; border-radius: 4px; }
.card-in > :not(.art) { position: relative; z-index: 1; }
.card.hasart .nm, .card.hasart .st { background: color-mix(in srgb, var(--card) 78%, transparent); border-radius: 3px; }
.card.hasart .st { align-self: stretch; }
#cardinfo .artbox { display: grid; gap: 4px; margin: 6px 0; }
#cardinfo .artbox img { width: 100%; max-height: 240px; object-fit: contain; border-radius: 6px; background: var(--bg); }

.note.foot { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; display: grid; gap: 3px;
  max-height: 40dvh; overflow: auto; }
.live .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.live input[type=number] { width: 4.5em; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.choices { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; }
.choices h3 { margin: 0; font-size: .72rem; color: var(--muted); font-weight: 600; }
.choices .btns { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.choices button { text-align: left; }
.choices button.danger { border-color: var(--fury); color: var(--fury); }
.choices button.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.choices .name-cards { display: grid; gap: 6px; min-width: 0; width: min(100%, 26rem); }
.name-cards input { width: 100%; min-height: 2.75rem; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.name-cards .name-results { display: grid; gap: 4px; max-height: 10rem; overflow: auto; }
.name-cards button { min-height: 2.75rem; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <header class="top">
      <h1>Riftbound トレースビューア</h1>
      <span class="status" id="status"></span>
    </header>
    <div class="phases" id="phases"></div>
  </div>
  <div class="empty" id="empty" hidden>
    <p><code>riftbound-trace</code> が書き出した JSON を選んでください。</p>
    <input type="file" id="file" accept=".json,application/json" aria-label="トレースの JSON">
  </div>
  <section class="live" id="live" hidden aria-label="ライブ操作">
    <div class="row">
      <b>ライブ操作</b>
      <label>seed <input type="number" id="seed" value="1" min="0"></label>
      <label>操作する席 <select id="seat"><option value="0" selected>P0（P1 は自動）</option>
        <option value="1">P1（P0 は自動）</option><option value="01">両方</option></select></label>
      <label>ルール <select id="kind"><option value="core" selected>Core Rules（デモ）</option>
        <option value="constructed">大会: Constructed</option><option value="sealed">大会: Sealed（Legend なし）</option>
        <option value="draft">大会: Draft（Legend なし）</option></select></label>
      <label>試合 <select id="matchmode"><option value="single" selected>1 ゲームだけ</option>
        <option value="bo1">Best of 1</option><option value="bo3">Best of 3</option></select></label>
      <button id="newgame">新しいゲーム</button>
      <button id="undobtn" hidden title="直前の答えを取り消す（Ctrl+Z）">1 手戻す</button>
      <span class="note" id="livemsg" role="status"></span>
    </div>
    <div class="note" id="matchinfo"></div>
    <div class="choices" id="choices" aria-live="polite"></div>
  </section>
  <div id="result" class="banner" hidden></div>
  <div class="layout" id="layout" hidden>
    <div class="board" id="board"></div>
    <div class="side">
      <div class="now" id="now"></div>
      <ol class="log" id="log"></ol>
    </div>
  </div>
  <div class="controls" id="controls" hidden>
    <button id="first" aria-label="最初へ">⏮</button>
    <button id="prev" aria-label="1 手戻る">◀</button>
    <button id="play" aria-label="再生">▶ 再生</button>
    <button id="next" aria-label="1 手進む">▶|</button>
    <button id="last" aria-label="最後へ">⏭</button>
    <input type="range" id="scrub" min="0" value="0" aria-label="手の位置">
    <label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option></select></label>
  </div>
  <p class="note foot">このビューアにルールはありません。見えているものはすべて Lean のエンジン（<code>step</code>）が
    計算した結果の再生です。ただし、この描画のコードは Lean の証明の対象外です。</p>
</div>
<div id="fly"></div>
<div id="cardinfo" hidden role="dialog" aria-label="カードの詳細"></div>
<div id="actmenu" hidden role="menu" aria-label="このカードで選べる手"></div>
<script>
const EMBEDDED = /*__TRACE__*/null;
const $ = (id) => document.getElementById(id);
const PHASES = ['setup', 'awaken', 'beginning', 'channel', 'draw', 'main', 'ending'];
const PHASE_JA = { setup: '準備', awaken: 'Awaken', beginning: 'Beginning', channel: 'Channel', draw: 'Draw', main: 'Main', ending: 'Ending' };
const PILES = [['championZone', 'Champion'], ['mainDeck', 'Main Deck'], ['runeDeck', 'Rune Deck'], ['trash', 'Trash'],
  ['banishment', 'Banish'], ['setAside', '脇に置いた札'], ['outOfGame', 'ゲーム外']];
const LANES = [['legendZone', 'Legend'], ['base', 'Base'], ['hand', 'Hand']];
const DOMAINS = ['fury', 'calm', 'mind', 'body', 'chaos', 'order'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let trace, steps, cards, objs, cur = 0, playing = false, timer = null, speed = 1;
const els = new Map();        // object id -> card element
const zoneBox = new Map();    // zone name -> container element
const poolBox = [], pointsBox = [], seatBox = [];
const bfGroup = new Map();    // Battlefield id -> its column

function cardCode(id, state) { return state?.copies?.[id] || objs[id]?.card; }
function cardNameAt(id, state) {
  const code = cardCode(id, state);
  return cards[code]?.name || code || '#' + id;
}
function cardName(id) { return cardNameAt(id, steps[cur]?.state); }
function logicalCardName(code) {
  const card = cards[code];
  return card ? [card.name, card.subtitle].filter(Boolean).join(', ') : code;
}
function dur() { return reduce ? 0 : 480 / speed; }

function load(t) {
  pause(); cur = 0;
  trace = t; steps = t.steps; cards = t.cards; objs = {};
  for (const s of steps) for (const [id, o] of Object.entries(s.state.new)) objs[id] = o;
  buildBoard(); buildLog();
  $('empty').hidden = true; $('layout').hidden = false; $('controls').hidden = false;
  $('scrub').max = steps.length - 1;
  show(0, false);
}

const baseGroups = new Map();
function buildBoard() {
  baseGroups.clear();
  const board = $('board'); board.textContent = ''; els.clear(); zoneBox.clear();
  poolBox.length = pointsBox.length = seatBox.length = 0;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const seat = (p) => {
    const s = mk('section', 'seat'); seatBox[p] = s;
    const head = mk('div', 'seat-head'); head.append(mk('h2', '', 'P' + p));
    pointsBox[p] = mk('span', 'pts'); poolBox[p] = mk('div', 'pool'); head.append(pointsBox[p], poolBox[p]);
    const piles = mk('div', 'piles');
    for (const [k, label] of PILES) {
      const e = mk('div', 'pile'); e.append(mk('span', '', label), mk('b', '', '0'));
      zoneBox.set('p' + p + '.' + k, e); piles.append(e);
    }
    head.append(piles); s.append(head);
    for (const [k, label] of LANES) {
      const l = mk('div', 'lane'); l.dataset.label = label; l.dataset.zone = 'p' + p + '.' + k; zoneBox.set('p' + p + '.' + k, l); s.append(l);
      if (k === 'base') {
        // Runes and the other cards at Base sit in separate groups, so they are not mixed up.
        const rg = mk('div', 'grp runes'); rg.dataset.label = 'Rune'; const og = mk('div', 'grp others');
        l.append(rg, og); baseGroups.set('p' + p + '.base', { runes: rg, others: og });
      }
    }
    return s;
  };
  board.append(seat(0));
  const mid = mk('div', 'midrow');
  const bf = mk('div', 'lane bfs'); bf.dataset.label = 'Battlefield'; zoneBox.set('battlefield', bf); mid.append(bf);
  bfGroup.clear();
  const ch = mk('div', 'lane'); ch.dataset.label = 'Chain'; zoneBox.set('chain', ch); mid.append(ch);
  board.append(mid);
  for (let p = 1; p < trace.players; p++) board.append(seat(p));
  const ph = $('phases'); ph.textContent = '';
  for (const k of PHASES) { const e = mk('span', 'phase', PHASE_JA[k]); e.dataset.phase = k; ph.append(e); }
}

function describe(i) {
  const a = steps[i].action;
  if (!a) return ['ゲーム開始前', '山札・Rune Deck・Battlefield の準備ができた状態'];
  const before = steps[i - 1]?.state;
  return describeA(a, before?.pending, before);
}

// 答え a の説明。prev は、答える前に開いていた質問（フレーム）の名前。
function describeA(a, prev, state = steps[cur]?.state) {
  const cardName = (id) => cardNameAt(id, state);
  const showOffLabel = (choice, card) => {
    if (typeof choice.showOff === 'number') {
      const faceDown = Object.entries(state?.zones || {}).some(([zone, ids]) =>
        zone.endsWith('.hidden') && ids.includes(choice.showOff));
      return (faceDown ? '伏せたカード' : cardName(choice.showOff)) + ' を Show Off';
    }
    return cards[cardCode(card, state)]?.keywords?.some(({ k }) => k === 'showOff')
      ? 'Show Off を見送る' : '';
  };
  const spellObjectCostLabel = (choice, card) => {
    if (typeof choice.extraCostObject !== 'number') return '';
    const name = cardName(choice.extraCostObject);
    const kind = cards[cardCode(card, state)]?.spellObjectCost;
    if (kind === 'exhaustUnit') return name + ' を Exhaust';
    if (kind === 'returnUnit') return name + ' をオーナーの手札に戻す';
    return '追加コストに ' + name + ' を使う';
  };
  const addLabel = (add) => {
    const id = add.source;
    if (!add.rune) return cardName(id) + ' の Add';
    const runes = (state?.zones['p' + objs[id]?.owner + '.base'] || [])
      .filter(candidate => cardCode(candidate, state) === cardCode(id, state));
    const order = runes.indexOf(id);
    const name = runes.length > 1 && order >= 0 ? cardName(id) + '（' + (order + 1) + '枚目）' : cardName(id);
    return name + (add.rune === 'recycle' ? ' の Recycle' : ' の Exhaust');
  };
  const spellChoices = (execution) => {
    const choices = [];
    if (typeof execution.mode === 'number') choices.push(execution.modeLabel || 'モード ' + (execution.mode + 1));
    if (execution.moveDest !== undefined) choices.push(execution.moveDest === null ? 'Base' : cardName(execution.moveDest));
    const targets = (execution.targets || []).map((id, i) => {
      const controller = execution.targetControllers?.[i];
      return (controller == null ? '' : 'P' + controller + ' の ') + cardName(id);
    });
    if (typeof execution.targetPlayer === 'number') targets.unshift('P' + execution.targetPlayer);
    choices.push(targets.length ? '対象 ' + targets.join('、') : '対象なし');
    return choices.join('、');
  };
  const repeatChoices = (executions) =>
    executions.map((execution, i) => (i + 1) + '回目 ' + spellChoices(execution)).join(' ／ ');

  const who = a.actor === 'chance' ? '乱数' : a.actor === 'clock' ? '時計' : a.actor === 'judge' ? 'ジャッジ' : 'P' + a.actor.slice(1);
  switch (a.kind) {
    case 'arrange': return [who + ': 並び替え', 'シャッフル、または Recycle の順番'];
    case 'arrangePlayers': return [who + ': 手番順を決める', 'ターン順が決まった'];
    case 'pick': return [who + ': Battlefield を選ぶ', '抽選で Battlefield が場に出る'];
    case 'nameCard': return [who + ': ' + logicalCardName(a.cardCode) + ' を指定', ''];
    case 'mulliganDone': return [who + ': マリガンしない', '手札を確定した'];
    case 'discardDone': return [who + ': 捨てるカードがない', '手札が空なので捨てる処理を終える'];
    case 'discardPick': return [who + ': ' + cardName(a.card) + ' を捨てる', cardName(a.card) + ' を手札から Trash へ'];
    case 'decide': {
      if (a.cancelTriggerFunding) return [who + ': 誘発能力の選択に戻る', '選んだ Add を取り消す'];
      if (a.effectCost) {
        const cost = costText(a.effectCost);
        if (a.spellPaymentTarget != null) {
          const spell = cardName(a.spellPaymentTarget);
          return [who + ': ' + (a.yes ? cost + ' を払って ' + spell + ' を奪う' : spell + ' を打ち消す'), ''];
        }
        return [who + ': ' + (a.yes ? cost + ' を支払う' : '支払いを見送る'), ''];
      }
      if (a.effectPaymentPlan) return [who + ': ' + costText(a.effectPaymentPlan) + ' を支払う', ''];
      if (a.moreEffectPayments) return [who + ': ほかの支払い方を見る', ''];
      if (a.remakeSpell != null) {
        const spell = cardName(a.remakeSpell);
        return [who + ': ' + spell + ' の選択を' + (a.yes ? 'やり直す' : '維持する'), ''];
      }
      if (a.trashSpellOffer) return [who + ': ' + (a.yes ? 'トラッシュから呪文をプレイする' : 'プレイを見送る'), ''];
      if (a.revealedPlayOffer) return [who + ': ' + (a.yes ? '公開したカードからプレイする' : 'プレイを見送る'), ''];
      if (a.moreSpellChoices != null || a.moreTrashSpellChoices) return [who + ': ほかの選択肢を見る', ''];
      if (a.remadeSpell != null || a.queuedSpell != null) {
        const choices = a.repeatExecutions ? repeatChoices(a.repeatExecutions) : spellChoices(a);
        if (a.queuedSpell != null) {
          const action = a.chooseSpellPayment ? ' の支払いを選ぶ' : ' をプレイ';
          const finalization = [showOffLabel(a, a.queuedSpell), choices,
            spellObjectCostLabel(a, a.queuedSpell)].filter(Boolean).join('、');
          const payment = [costText(a.queuedCost)];
          if (a.playDiscard !== undefined) {
            payment.push(a.playDiscard === null ? '手札を捨てない' : cardName(a.playDiscard) + ' を捨てる');
          }
          if (a.preparedAdds?.length) payment.push('選択済み ' + a.preparedAdds.map(addLabel).join('、'));
          return [who + ': ' + cardName(a.queuedSpell) + action + '（' + finalization + '）', payment.join(' ・ ')];
        }
        return [who + ': ' + cardName(a.remadeSpell) + ' の選択を確定（' + choices + '）', ''];
      }
      if (a.lookedPlay) return [who + ': ' + (a.yes ? '見たカードからプレイする' : 'プレイを見送る'), ''];
      if (a.empowerOffer) return [who + ': ' + (a.yes ? 'Empower する' : 'Empower を見送る'), ''];
      if (a.morePlayOptions) return [who + ': ほかのプレイ方法を見る', ''];
      if (a.morePlayPayments) return [who + ': ほかの支払い方を見る', ''];
      if (a.declinePlay) return [who + ': プレイを見送る', ''];
      const prepared = a.preparedAdds?.length ? '選択済み ' + a.preparedAdds.map(addLabel).join('、') : '';
      if (a.playAdd) {
        const add = a.playAdd;
        const cost = add.cost && (add.cost.energy || add.cost.power?.length) ? '（' + costText(add.cost) + '）' : '';
        return [who + ': ' + addLabel(add) + ' を選ぶ' + cost, prepared];
      }
      if (a.reducedPlay) {
        const plan = a.reducedPlay;
        const dest = plan.destination === null ? 'Base' : cardName(plan.destination);
        const parts = [costText(plan.cost)];
        const showOff = showOffLabel(plan, plan.card);
        if (showOff) parts.push(showOff);
        if (plan.battlefieldFees?.length) parts.push(plan.battlefieldFees.map(cardName).join('、') + ' の追加コストを払う');
        const def = cards[cardCode(plan.card, state)];
        if (plan.additionalPaid || def?.optionalCost) parts.push(plan.additionalPaid ? '追加コストを払う' : '追加コストを見送る');
        if (plan.accelerated || def?.keywords?.some(({ k }) => k === 'accelerate')) {
          parts.push(plan.accelerated ? 'Accelerate を使う' : 'Accelerate を見送る');
        }
        if (plan.extraObject != null) parts.push(cardName(plan.extraObject) + ' で追加コストを払う');
        if (plan.discard != null) parts.push(cardName(plan.discard) + ' を捨てる');
        const verb = a.choosePlayPayment ? ' にプレイする方法を選ぶ' : ' にプレイ';
        return [who + ': ' + cardName(plan.card) + ' を ' + dest + verb + '（' + parts.join('、') + '）', prepared];
      }
      if (a.moreDamageReplacements) return [who + ': ほかの置換効果を見る', ''];
      if (a.banishDeathUnit != null) {
        if (a.banishingPlayer == null) return [who + ': ほかの置換効果を見る', ''];
        return [who + ': P' + a.banishingPlayer + ' の効果で ' + cardName(a.banishDeathUnit) + ' を Banish',
          'このユニットの死亡を置き換える'];
      }
      if (a.damageReplacement) {
        const replacement = a.damageReplacement === 'double' ? '2倍にする' :
          a.damageReplacement === 'shield' ? 'すべて防ぐ' : '最大 ' + a.preventValue + ' 軽減する';
        const detail = a.combatDamageOrder ? '戦闘ダメージの割り振りに適用' : '置換前のダメージ ' + a.incomingDamage;
        return [who + ': ' + cardName(a.unit) + ' へのダメージを' + replacement, detail];
      }
      if (a.damageOrder) {
        const first = a.damageOrder === 'preventFirst' ? 'ダメージの軽減' : 'ダメージの倍増';
        return [who + ': ' + cardName(a.unit) + ' に先に' + first + 'を適用する', ''];
      }
      if (a.moreLocations) return [who + ': ' + a.token + ' を Battlefield に出す', '行き先を選ぶ'];
      if (a.moveLocation === 'base') return [who + ': ' + cardName(a.unit) + ' を Base に移動する', ''];
      if (a.moveLocation === 'battlefield') return [who + ': 移動先の Battlefield を選ぶ', ''];
      if (a.token) {
        const dest = a.dest === null ? 'Base' : cardName(a.dest);
        return [who + ': ' + a.token + ' を ' + dest + ' に出す', ''];
      }
      return [who + ': ' + (a.yes ? 'する' : 'しない'), '「〜してもよい」の効果を' + (a.yes ? 'する' : 'しない')];
    }
    case 'choose': {
      const card = cardName(a.obj);
      if (a.choiceContext === 'own') return [who + ': 自分の ' + card + ' を選ぶ', '全員の選択が終わると効果の解決を続ける'];
      if (a.choiceContext === 'move') return [who + ': ' + cardName(a.unit) + ' を ' + card + ' へ移動する', ''];
      if (a.choiceContext === 'retain') return [who + ': ' + card + ' を対象に残す', 'もとの対象から効果を受けるカードを選ぶ'];
      if (a.choiceContext === 'revealedHand') return [who + ': ' + card + ' を選ぶ', '公開された手札から選ぶ'];
      if (a.choiceContext === 'lookedDeck') return [who + ': ' + card + ' を選ぶ', '見たカードからプレイする1枚を選ぶ'];
      if (a.choiceContext === 'revealedPlay') return [who + ': ' + card + ' を選ぶ', '公開したカードからプレイする1枚を選ぶ'];
      if (a.choiceContext === 'attachmentCopy') return [who + ': ' + card + ' をコピー元に選ぶ',
        a.unit == null ? '' : cardName(a.unit) + ' が装着中にコピーする'];
      return [who + ': ' + card + ' を選ぶ', '効果の対象に ' + card + ' を選ぶ'];
    }
    case 'predictPick': {
      const card = cardName(a.card);
      return a.recycle
        ? [who + ': ' + card + ' を Recycle', '山札の下へ送る。複数枚なら順番はランダム']
        : [who + ': ' + card + ' を山札の上に残す', '残すカードは選んだ順に上から並ぶ'];
    }
    case 'mulliganPick': return [who + ': ' + cardName(a.card) + ' をマリガン', cardName(a.card) + ' を脇に置く'];
    case 'burnOutTarget': return [who + ': Burn Out の相手を選ぶ', 'P' + a.opponent + ' が 1 点を得る'];
    case 'assignPick':
      return [who + ': ' + cardName(a.unit) + ' に先にダメージを割り当てる', 'Combat Damage: 致死ダメージを与える順に、相手の Unit を選ぶ（Tank が先）'];
    case 'assignDone':
      return [who + ': 割り当てを確定', '選んだ順に致死ダメージを割り当て、残りは最後の Unit へ。両陣営が終えると同時に与える'];
    case 'standardMove': {
      const destination = a.dest === null ? 'Base' : cardName(a.dest);
      const move = a.movePayment
        ? destination + ' へ Standard Move（' + costText(a.movePayment) + ' を支払う）'
        : 'Standard Move';
      return [who + ': ' + cardName(a.unit) + ' を ' + move,
        destination + (a.dest === null ? ' へ戻る' : ' へ移動する') + '（Unit は Exhaust する）'];
    }
    case 'pass':
      if (prev === 'showdown') return [who + ': パス', 'Showdown でパス（全員がパスすると、Unit が 1 人だけなら Control と Conquer、2 人いれば Combat Damage）'];
      if (prev === 'chainPass') return [who + ': パス', 'Chain の項目に応答しない（全員がパスすると、いちばん上の項目が解決する）'];
      return [who + ': パス', 'Main Phase を終えてターンを終える'];
    case 'activate': {
      const targetIds = a.targets || [];
      const legacyKill = a.costBanish && typeof a.killCostObject !== 'number';
      const targets = (legacyKill ? targetIds.slice(0, -1) : targetIds).map((t) => cardName(t));
      if (typeof a.targetPlayer === 'number') targets.unshift('P' + a.targetPlayer);
      const tg = targets.join('、');
      const dc = (a.discards || []).map((t) => cardName(t)).join('、');
      const power = a.power || [];
      const costs = [];
      if (a.disempowerSelf) costs.push('Disempower');
      if (a.exhaustSelf) costs.push('Exhaust');
      if (typeof a.exhaustCostObject === 'number') costs.push(cardName(a.exhaustCostObject) + ' を Exhaust');
      if (a.costBanish) costs.push('P' + a.costBanish.player + ' の効果で ' + cardName(a.costBanish.unit) + ' を Banish');
      else if (typeof a.killCostObject === 'number') costs.push(cardName(a.killCostObject) + ' を Kill');
      if (typeof a.pay === 'number' && (a.pay > 0 || !costs.length)) {
        costs.push(costText({ energy: a.pay - power.length, power }));
      }
      const action = a.abilityEffect === 'readySelf' ? ' を Ready にする能力を起動' : ' の能力を起動';
      return [who + ': ' + cardName(a.source) + action +
        (costs.length ? '（' + costs.join('、') + '）' : '') +
        (dc ? '（捨てる: ' + dc + '）' : '') + (tg ? '（対象: ' + tg + '）' : ''),
        'コストを払って、能力を Chain に載せる（能力は Chain 上のオブジェクトになる）'];
    }
    case 'triggerAdd': {
      const selected = a.triggerPreparedAdds || [];
      return [who + ': ' + addLabel(a.playAdd) + ' を選ぶ',
        selected.length ? '選択済み ' + selected.map(addLabel).join('、') : '確定時に支払う'];
    }
    case 'prepareTrigger':
    case 'putTrigger': {
      const ability = a.source == null ? '誘発能力' : cardName(a.source) + ' の誘発能力';
      if (a.decline) return [who + ': ' + ability + 'を見送る', 'コストは支払わず、能力は Chain に載らない'];
      if (a.unavailable) return [who + ': ' + ability + 'を取り除く', '選べる対象がないため、能力は Chain に残らない'];
      const targets = (a.targets || []).map(cardName);
      if (typeof a.targetPlayer === 'number') targets.unshift('P' + a.targetPlayer);
      const replacements = new Map((a.costBanishes || []).map(({unit, player}) => [unit, player]));
      const sacrifices = (a.sacrifices || []).map((id) => {
        const card = cardName(id);
        return replacements.has(id) ? 'P' + replacements.get(id) + ' の効果で ' + card + ' を Banish' :
          card + ' を Kill';
      }).join('、');
      const energy = a.energy ? '（Energy ' + a.energy + ' を支払う）' : '';
      const exhaust = a.exhaustSource ? '（発生源を Exhaust）' : '';
      const burn = a.burn ? '（Burn ' + a.burn + ' を支払う）' : '';
      const mode = typeof a.mode === 'number' ? '（' + (a.modeLabel || 'モード ' + (a.mode + 1)) + '）' : '';
      const deflect = a.triggerDeflect ? '（Deflect ' + a.triggerDeflect + ' Power）' : '';
      const targetText = targets.length ? '（対象 ' + targets.join('、') + '）' : '（対象なし）';
      const choices = mode + energy + deflect + exhaust + burn +
        (sacrifices ? '（コストとして ' + sacrifices + '）' : '') + targetText;
      if (a.kind === 'prepareTrigger') {
        return [who + ': ' + ability + 'の支払いを選ぶ' + choices, 'Add や Rune を選ぶ'];
      }
      if (a.triggerPreparedAdds?.length) {
        return [who + ': ' + ability + 'を確定' + choices, '支払い ' + a.triggerPreparedAdds.map(addLabel).join('、')];
      }
      return [who + ': ' + ability + 'を確定' + choices,
        sacrifices ? 'コストを払ってから能力を Chain に載せる' :
          (burn ? '山札の上からカードを Trash に置いてから能力を Chain に載せる' :
            '確定した能力は最後に Chain に載ったものから解決する')];
    }
    case 'manaAbility': {
      if (a.unitEnergyAdded != null) {
        const cost = costText({energy: a.energy, power: a.power});
        return [who + ': ' + cardName(a.source) + ' の Add（' + cost + '）',
          'Exhaust し、Unit のプレイと起動型能力に使える Energy を ' + a.unitEnergyAdded + ' 得る'];
      }
      return [who + ': ' + cardName(a.source) + ' の Add 能力', 'Chain を使わず、すぐ資源が増える（Exhaust する）'];
    }
    case 'runeAbility':
      if (a.ability === 'exhaust') return [who + ': ' + cardName(a.card) + ' を Exhaust', 'Energy +1'];
      return [who + ': ' + cardName(a.card) + ' を Recycle', (objs[a.card] && objs[a.card].rune || '') + ' Power +1、Rune Deck の下へ'];
    case 'playCard': {
      const o = objs[a.card], def = o && cards[o.card];
      const base = a.flowCost;
      const printed = typeof def?.cost === 'number' ? def.cost + (def.costFull?.power?.length || 0) : null;
      const fees = a.battlefieldFees || [];
      const permanentChoice = def && !def.types.includes('spell') &&
        (typeof a.additionalCostPaid === 'boolean' || typeof a.accelerated === 'boolean');
      const energy = a.pay - (a.power?.length || 0);
      const flow = base ? '（Flow ' + base.energy + ' Energy' +
        (base.power.length ? ' + ' + base.power.join('+') + ' Power' : '') + '）' : '';
      const objectCost = spellObjectCostLabel(a, a.card);
      const cost = fees.length || permanentChoice || a.repeatExecutions || objectCost
        ? '（' + energy + ' Energy）' + flow
        : flow || (printed !== null && a.pay > printed ? '（追加コスト +' + (a.pay - printed) + '）' : '');
      const discard = a.discards?.length ? '（' + a.discards.map(cardName).join('、') + ' を捨てる）'
        : def?.discardToPlay ? '（捨てない）' : '';
      const extra = def?.optionalCost && typeof a.additionalCostPaid === 'boolean'
        ? (a.additionalCostPaid ? '（追加コストを払う）' : '（追加コストを見送る）') : '';
      const repeat = typeof a.repeatsPaid === 'number' && (a.repeatsPaid || !def?.optionalCost)
        ? '（Repeat ' + a.repeatsPaid + ' 回）' : '';
      const mode = !a.repeatExecutions && typeof a.mode === 'number'
        ? '（' + (a.modeLabel || 'モード ' + (a.mode + 1)) + '）' : '';
      const dest = !a.repeatExecutions && 'moveDest' in a
        ? '（移動先 ' + (a.moveDest === null ? 'Base' : cardName(a.moveDest)) + '）' : '';
      const fee = fees.length ? '（' + fees.map(cardName).join('、') + ' の追加コストを払う）' : '';
      const accelerate = typeof a.accelerated === 'boolean'
        ? (a.accelerated ? '（Accelerate を使う）' : '（Accelerate を見送る）') : '';
      const showOff = showOffLabel(a, a.card);
      const more = cost + (a.power && a.power.length ? ' [Power: ' + a.power.join('+') + ']' : '') +
        discard + extra + repeat + mode + dest + fee + accelerate + (showOff ? '（' + showOff + '）' : '') +
        (objectCost ? '（' + objectCost + '）' : '');
      if (def && def.types.includes('spell')) {
        const targets = (a.targets || []).map(cardName);
        if (typeof a.targetPlayer === 'number') targets.unshift('P' + a.targetPlayer);
        const choices = a.repeatExecutions ? '（' + repeatChoices(a.repeatExecutions) + '）'
          : targets.length ? '（対象: ' + targets.join('、') + '）' : '';
        const react = prev === 'chainPass';
        const play = a.hiddenPlay ? ' を Hidden からプレイ' : react ? ' を Reaction でプレイ' : ' をプレイ';
        return [who + ': ' + cardName(a.card) + play + more + choices,
          react ? 'Chain の項目に応答する: 上に積まれ、先に解決する' : 'コストを払って Chain に載せる'];
      }
      const placement = a.playDestination == null ? '' : ' を ' + cardName(a.playDestination) + ' に';
      return [who + ': ' + cardName(a.card) + (placement || ' を') + 'プレイ' + more,
        'コストを払って場に出す（通常、Unit は Exhaust で入る）'];
    }
    case 'concede': return [who + ': 投了する', 'ゲームを投了する。相手の勝ちになる（CR 651）'];
    case 'timeCalled': return [who + ': 時間切れを知らせる', '今のターンを最後まで行い、さらに 3 ターン行う。その後、点差 2 点以上のプレイヤーが勝ち、そうでなければ引き分け（TR 408.2）'];
    case 'declareDraw': return [who + ': 引き分けを宣言する', '選手が合意した（TR 410.1）、または終わらないループ（TR 505.6）。ゲームは、その場で引き分けで終わる'];
    default: return [who + ': ' + a.kind, ''];
  }
}

function buildLog() {
  const log = $('log'); log.textContent = '';
  steps.forEach((s, i) => {
    const li = document.createElement('li'); li.textContent = i + '. ' + describe(i)[0];
    li.addEventListener('click', () => { pause(); show(i, false); }); log.append(li);
  });
}

function rectOf(e) { const r = e.getBoundingClientRect(); return { left: r.left, top: r.top }; }

function visibleZones() {
  const z = [];
  for (let p = 0; p < trace.players; p++) for (const [k] of LANES) z.push('p' + p + '.' + k);
  z.push('battlefield', 'chain'); return z;
}

function makeCard(id) {
  const el = document.createElement('div'); el.className = 'card'; el.dataset.id = id;
  return el;
}

function updateCardTraits(el, id, state) {
  const code = cardCode(id, state) || '?';
  if (el.dataset.card === code) return;
  el.dataset.card = code;
  const o = objs[id] || {}, def = cards[code] || { name: code, types: [], domains: [] };
  const inn = document.createElement('div'); inn.className = 'card-in';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = def.name;
  inn.append(nm);
  if (o.ability !== undefined && !el.querySelector('.ab')) {
    el.classList.add('ability');
    const ab = document.createElement('span'); ab.className = 'ab'; ab.textContent = '能力'; el.append(ab);
  }
  el.classList.toggle('rune', def.types.includes('rune'));
  if (def.types.includes('rune')) { if (o.rune) inn.classList.add('d-' + o.rune); }
  else {
    const st = document.createElement('div'); st.className = 'st';
    const c = document.createElement('span'); c.textContent = def.cost != null ? def.cost : '';
    const m = document.createElement('span'); m.textContent = def.might != null ? def.might : '';
    st.append(c, m); inn.append(st);
    if (def.domains[0]) inn.classList.add('d-' + def.domains[0]);
  }
  const old = el.querySelector('.card-in');
  if (old) old.replaceWith(inn); else el.prepend(inn);
  applyArt(el);
}

function decorate(e, st, id) {
  updateCardTraits(e, id, st);
  e.firstChild.classList.toggle('exh', st.exhausted.includes(+id));
  let d = e.querySelector('.dmg'); const dm = st.damaged.find((x) => x[0] === +id);

function zoneOfPrev(prevState, id) {

function show(i, animate) {

  const pileRect = (zone) => { const b = zoneBox.get(zone); return b ? rectOf(b) : null; };

      else { const z = zoneOfPrev(prev, old !== undefined ? old : id); from = z ? pileRect(z) : null; fade = true; }

  }

  const order = m.order === 'chance' ? '最初のゲーム: 抽選で選ばれた人が先手か後手かを選ぶ（TR 407）'
    : m.order.startsWith('loser') ? '次のゲーム: 負けた P' + m.order.slice(5) + ' が先手か後手かを選ぶ（TR 407）'
    : '次のゲーム: 引き分けの後なので、先手は同じ P' + m.order.slice(4) + '（TR 407）';
  return 'Best of ' + (m.target * 2 - 1) + ' ・ 勝ち P0 ' + m.wins[0] + ' - P1 ' + m.wins[1] + ' ・ ' + m.games + ' ゲーム'
    + (m.finished ? ' ・ マッチ終了: 勝者 P' + m.winner : ' ・ ' + order
      + ' ・ サイドボード: ' + (m.sideboard ? '使える' : '使えない') + (m.sameBattlefields ? ' ・ 同じ Battlefield' : ''));
}
// 手とカードの結びつき: カードをクリックして答える。手が 1 つならすぐ、複数ならメニューで選ぶ。
// 結びつけるのは、盤面にそのカードがあるときだけ（無ければボタンのまま）。
function actCard(a) {
  if (a.playAdd?.rune) return a.playAdd.source;
  switch (a.kind) {
    case 'runeAbility': case 'playCard': case 'mulliganPick': case 'discardPick': return a.card;
    case 'choose': return a.obj;
    case 'standardMove': case 'assignPick': return a.unit;
    case 'manaAbility': case 'activate': return a.source;
    default: return null;
  }
}
let cardActs = new Map(), showAllMoves = false;
function clearActMarks() {
  cardActs = new Map(); hideActMenu(); pick = null; clearPickMarks();
  document.querySelectorAll('.card.act').forEach((c) => { c.classList.remove('act'); c.removeAttribute('tabindex'); });
}
function markActCards(list) {
  clearActMarks();
  for (const l of list) {
    const id = actCard(l.a); if (id === null || id === undefined) continue;
    const c = document.querySelector('.card[data-id="' + id + '"]'); if (!c) continue;
    if (!cardActs.has(String(id))) cardActs.set(String(id), []);
    cardActs.get(String(id)).push(l);
    c.classList.add('act'); c.tabIndex = 0;
  }
}
function hideActMenu() { const m = $('actmenu'); if (m) m.hidden = true; }
// 手が「対象」や「移動先」だけ違うときは、カードを選んだあと、盤面の光っている所をクリックして選ぶ。
// プレイ・起動では対象、盤面のコスト、捨てるカードの順に選ぶ。移動では Base か Battlefield を選ぶ。
// 捨てない手も選べる場合など、ほかの違いが残ればメニューを開く。
function selSeq(a) {
  if (a.kind === 'standardMove') return [a.dest === null ? 'base' : String(a.dest)];
  if (a.kind === 'activate' || a.kind === 'playCard') {
    const cost = a.exhaustCostObject ?? a.killCostObject;
    return [...(a.targets || []), ...(typeof cost === 'number' ? [cost] : []), ...(a.discards || [])].map(String);
  }
  return [];
}
let pick = null;
function selElems(key, actor) {
  if (key === 'base') { const l = document.querySelector('.lane[data-zone="' + actor + '.base"]'); return l ? [l] : []; }
  const out = [], c = document.querySelector('.card[data-id="' + key + '"]'), g = document.querySelector('.bf[data-bf="' + key + '"]');
  if (c) out.push(c); if (g) out.push(g); return out;
}
function clearPickMarks() {
  document.querySelectorAll('.tgt').forEach((e) => { e.classList.remove('tgt'); if (!e.classList.contains('card')) return; e.removeAttribute('tabindex'); });
}
function showMenu(list, title, x, y) {
  const m = $('actmenu'); m.textContent = '';
  const state = steps[steps.length - 1].state;
  const h = document.createElement('h3'); h.textContent = title + '（' + list.length + ' 個）'; m.append(h);
  for (const l of list) {
    const [t, detail] = describeA(l.a, state.pending, state);
    const b = document.createElement('button'); b.textContent = t.replace(/^P\d: /, ''); b.title = detail || '';
    b.addEventListener('click', (e) => { e.stopPropagation(); hideActMenu(); liveAct(l.k); });
    m.append(b);
  }
  m.hidden = false;
  const w = m.offsetWidth, hh = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x + 6, innerWidth - w - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y + 6, innerHeight - hh - 8)) + 'px';
  const f = m.querySelector('button'); if (f) f.focus();
}
function showsPayment(a) {
  return Boolean(a.movePayment) || typeof a.extraCostObject === 'number';
}
function stepPick(x, y) {
  const { card, list, chosen } = pick, d = chosen.length;
  const rem = list.filter((l) => { const q = selSeq(l.a); return chosen.every((v, i) => q[i] === v); });
  const cands = [...new Set(rem.filter((l) => selSeq(l.a).length > d).map((l) => selSeq(l.a)[d]))];
  const done = rem.filter((l) => selSeq(l.a).length === d);
  const roles = new Set(rem.map(({a}) => {
    const afterTargets = d - (a.targets || []).length;
    if (afterTargets < 0) return 'target';
    const cost = typeof a.exhaustCostObject === 'number' ? 'exhaust' :
      typeof a.killCostObject === 'number' ? 'kill' : null;
    if (cost && afterTargets === 0) return cost;
    if (afterTargets < (a.discards || []).length + Number(Boolean(cost))) return 'discard';
    return 'target';
  }));
  if (!cands.length || done.length || roles.size !== 1) {
    pick = null; clearPickMarks();
    if (rem.length === 1 && !showsPayment(rem[0].a)) { liveAct(rem[0].k); return; }
    showMenu(rem, cardName(card) + ' で選べる手', x, y); return;
  }
  const actor = rem[0].a.actor;
  const elems = cands.map((k) => selElems(k, actor));
  if (elems.some((e) => !e.length)) { pick = null; clearPickMarks(); showMenu(rem, cardName(card) + ' で選べる手', x, y); return; }
  if (cands.length === 1) { pick.chosen = [...chosen, cands[0]]; stepPick(x, y); return; }
  clearPickMarks(); pick.cands = cands; pick.actor = actor;
  document.querySelectorAll('.card.act').forEach((c) => { c.classList.remove('act'); c.removeAttribute('tabindex'); });
  cands.forEach((k, i) => elems[i].forEach((e) => { e.classList.add('tgt'); if (e.classList.contains('card')) e.tabIndex = 0; }));
  const destination = cands.every((k) => k === 'base' || document.querySelector('.bf[data-bf="' + k + '"]'));
  const next = roles.has('discard') ? '捨てるカード' :
    roles.has('exhaust') ? 'コストとして Exhaust するカード' :
    roles.has('kill') ? 'コストとして Kill するカード' : destination ? '移動先' : '対象';
  $('livemsg').textContent = cardName(card) + ': ' + next + 'を選ぶ（光っている所をクリック。Escape でやめる）';
}
function pickClick(el, x, y) {
  const key = el.classList.contains('lane') ? 'base' : el.dataset.bf !== undefined ? el.dataset.bf : el.dataset.id;
  if (!pick.cands.includes(key)) return false;
  pick.chosen = [...pick.chosen, key]; stepPick(x, y); return true;
}
function cancelPick() { if (!pick) return; pick = null; renderLegal(steps.length - 1); }
function chooseCard(c, x, y) {
  const list = cardActs.get(c.dataset.id); if (!list || !live) return;
  if (list.length === 1 && !showsPayment(list[0].a)) { hideActMenu(); liveAct(list[0].k); return; }
  hideActMenu();
  if (list.every((l) => selSeq(l.a).length)) { pick = { card: c.dataset.id, list, chosen: [], cands: [] }; stepPick(x, y); return; }
  showMenu(list, cardName(c.dataset.id) + ' で選べる手', x, y);
}
document.addEventListener('click', (e) => {
  if (pick && !e.target.closest('#actmenu')) {
    const t = e.target.closest && e.target.closest('.card.tgt, .bf.tgt, .lane.tgt');
    if (t) { e.stopPropagation(); pickClick(t, e.clientX, e.clientY); } else cancelPick();
    return;
  }
  const c = e.target.closest && e.target.closest('.card.act');
  if (c && !e.target.closest('#actmenu')) { e.stopPropagation(); chooseCard(c, e.clientX, e.clientY); return; }
  if (!e.target.closest('#actmenu')) hideActMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { hideActMenu(); cancelPick(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tgt') && pick) {
    e.preventDefault(); const r = e.target.getBoundingClientRect(); pickClick(e.target, r.left + r.width / 2, r.top + r.height / 2);
  } else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('act')) {
    e.preventDefault(); const r = e.target.getBoundingClientRect(); chooseCard(e.target, r.left + r.width / 2, r.top + r.height / 2);
  }
});

function renderNameCards(box, options, btn) {
  const section = document.createElement('div'); section.className = 'name-cards';
  const input = document.createElement('input'); input.type = 'search'; input.id = 'name-card-filter';
  const label = document.createElement('label'); label.htmlFor = input.id; label.textContent = 'カード名を検索';
  const results = document.createElement('div'); results.className = 'name-results';
  const status = document.createElement('small'); status.setAttribute('role', 'status');
  const entries = options.map((l) => ({ ...l, name: logicalCardName(l.a.cardCode) }))
    .sort((a, b) => a.name.localeCompare(b.name));
  const update = () => {
    const query = input.value.trim().toLocaleLowerCase();
    const matches = entries.filter(({ name, a }) =>
      name.toLocaleLowerCase().includes(query) || a.cardCode.toLowerCase().includes(query));
    results.replaceChildren(...matches.map(({ k, a, name }) =>
      btn(name, a.cardCode, () => liveAct(k))));
    results.scrollTop = 0;
    status.textContent = matches.length ? matches.length + ' 件' : '該当するカードはありません';
  };
  input.addEventListener('input', update);
  section.append(label, input, status, results); box.append(section);
  update();
}

function renderLegal(i) {
  const box = $('choices'); box.textContent = '';
  clearActMarks();
  $('undobtn').hidden = !(live && steps && undoCount > 0 && i === steps.length - 1);
  if (!live || !steps || i !== steps.length - 1) return;
  const last = steps[i].state;
  $('matchinfo').textContent = matchText(liveMatch);
  const btn = (text, title, fn, cls) => {
    const b = document.createElement('button'); b.textContent = text; b.title = title || '';
    if (cls) b.classList.add(cls); b.addEventListener('click', fn); return b;
  };
  const group = (title, buttons) => {
    const h = document.createElement('h3'); h.textContent = title;
    const row = document.createElement('div'); row.className = 'btns'; row.append(...buttons); box.append(h, row);
  };
  if (last.result) {
    if (liveMatch && !liveMatch.finished) {
      if (askChoice !== null) {
        $('livemsg').textContent = 'P' + askChoice + ' が、次のゲームの先手か後手かを選ぶ（TR 407）';
        group('P' + askChoice + ' の選択', [
          btn('先手にする', '次のゲームで、先に動く', () => liveNext('first')),
          btn('後手にする', '次のゲームで、後に動く', () => liveNext('second'))]);
      } else {
        $('livemsg').textContent = 'このゲームは終わった。マッチは続く。';
        if (liveSide && liveSide.allowed) renderSideboard(group, btn);
        group('マッチ', [btn('次のゲーム', '結果をマッチに数えて、次のゲームを始める', () => liveNext(null))]);
      }
    } else {
      $('livemsg').textContent = liveMatch ? 'マッチ終了。「新しいゲーム」で、もう一度始められる。'
        : 'ゲーム終了。「新しいゲーム」で、もう一度始められる。';
    }
    return;
  }
  markActCards(liveLegal);
  const bound = (l) => { const id = actCard(l.a); return id !== null && id !== undefined && cardActs.has(String(id)); };
  const nBound = liveLegal.filter(bound).length;
  const naming = liveLegal.filter(({ a }) => a.kind === 'nameCard');
  const by = new Map();
  for (const l of liveLegal) {
    if (l.a.kind === 'nameCard' || (bound(l) && !showAllMoves)) continue;
    if (!by.has(l.a.actor)) by.set(l.a.actor, []); by.get(l.a.actor).push(l);
  }
  const choiceContext = liveLegal.find(({ a }) => a.choiceContext)?.a.choiceContext;
  const damageChoices = liveLegal.filter(({ a }) => a.damageReplacement);
  const banishChoices = liveLegal.filter(({ a }) => a.banishDeathUnit != null);
  const playPayment = liveLegal.find(({ a }) => a.playPaymentCost || a.preparedAdds)?.a;
  const playPrice = playPayment?.playPaymentCost || playPayment?.reducedPlay?.cost;
  const prompt = naming.length ? 'P' + naming[0].a.actor.slice(1) + ' がカードの名前を指定する'
    : choiceContext === 'own' ? '自分のカードから選ぶ'
    : choiceContext === 'retain' ? '対象に残すカードを選ぶ'
    : choiceContext === 'revealedHand' ? '公開された手札から選ぶ'
    : choiceContext === 'lookedDeck' ? '見たカードからプレイする1枚を選ぶ'
    : choiceContext === 'revealedPlay' ? '公開したカードからプレイする1枚を選ぶ'
    : choiceContext === 'trashSpell' ? 'トラッシュからプレイする呪文を選ぶ'
    : choiceContext === 'attachmentCopy' ? 'コピー元の味方 Unit を選ぶ'
    : liveLegal.some(({ a }) => a.cancelTriggerFunding) ? '誘発能力の支払いを選ぶ'
    : liveLegal.some(({ a }) => a.effectCost) ? '効果の支払いを選ぶ'
    : liveLegal.some(({ a }) => a.effectPaymentPlan) ? '支払うリソースを選ぶ'
    : liveLegal.some(({ a }) => a.remakeSpell != null) ? 'Spell の選択をやり直すか決める'
    : liveLegal.some(({ a }) => a.remadeSpell != null) ? 'Spell の新しい選択を確定する'
    : liveLegal.some(({ a }) => a.queuedSpell != null) ? '呪文の対象と支払いを選ぶ'
    : playPayment ? 'プレイの支払いを選ぶ' + (playPrice ? '（' + costText(playPrice) + '）' : '')
    : liveLegal.some(({ a }) => a.reducedPlay) ? '支払いとプレイ先を選ぶ'
    : damageChoices[0]?.a.combatDamageOrder ? '割り振り前に戦闘ダメージの置換順を選ぶ'
    : damageChoices.length ? '次に適用するダメージの置換効果を選ぶ'
    : banishChoices.length ? 'Banish に置き換える効果を選ぶ'
    : liveLegal.some(({a}) => a.damageOrder) ? 'ダメージに適用する効果の順番を選ぶ'
    : choiceContext === 'move' || liveLegal.some(({a}) => a.moveLocation) ? '移動先を選ぶ' : '答えを選ぶ';
  const answerCount = damageChoices.length
    ? liveLegal.filter(({ a }) => a.damageReplacement || a.moreDamageReplacements).length
    : banishChoices.length || (choiceContext === 'attachmentCopy'
      ? liveLegal.filter(({a}) => a.choiceContext === 'attachmentCopy').length : liveLegal.length);
  $('livemsg').textContent = liveLegal.length ? prompt + (naming.length ? '' : '（' + answerCount + ' 個）') +
    (nBound && !showAllMoves ? ': 青い枠のカードをクリック、または下のボタン' : '') : '';
  if (naming.length) renderNameCards(box, naming, btn);
  for (const [actor, list] of by) {
    group('P' + actor.slice(1) + ' の合法手', list.map((l) => {
      const [title, detail] = describeA(l.a, last.pending, last);
      return btn(title.replace(/^P\d: /, ''), detail, () => liveAct(l.k), l.a.kind === 'concede' ? 'danger' : null);
    }));
  }
  if (nBound) group('表示', [btn(showAllMoves ? 'カードの手を、ボタンから隠す' : 'カードの手も、ボタンで全部出す',
    'カードをクリックしても同じ手を選べる', () => { showAllMoves = !showAllMoves; renderLegal(steps.length - 1); })]);
  const ext = [];
  if (liveExt.clock) ext.push(btn('時計: 時間切れを知らせる', '今のターンを最後まで行い、さらに 3 ターン行って終わる（TR 408.2）', () => liveExternal('clock')));
  if (liveExt.judge) ext.push(btn('ジャッジ: 引き分けを宣言する', '選手の合意、または終わらないループ（TR 410.1、505.6）', () => liveExternal('judge'), 'danger'));
  if (ext.length) group('大会のルール', ext);
}
// サイドボード（TR 403.4）: Main Deck のカードを 1 枚出し、サイドボードのカードを 1 枚入れる。合法かどうかは Lean が決める。
function renderSideboard(group, btn) {
  const s = liveSide;
  const cardBtns = (list, sel, set) => list.map((c) =>
    btn(c.name + ' ×' + c.n, c.id, () => { set(sel === c.id ? null : c.id); renderLegal(steps.length - 1); },
      sel === c.id ? 'sel' : null));
  group('サイドボード（P' + s.player + '）: Main Deck ' + s.mainCount + ' 枚 ／ サイドボード ' + s.sideCount + ' 枚',
    []);
  group('出すカード（Main Deck）', cardBtns(s.main, swapOut, (v) => { swapOut = v; }));
  group('入れるカード（サイドボード）', cardBtns(s.side, swapIn, (v) => { swapIn = v; }));
  const nm = (list, id) => { const c = list.find((x) => x.id === id); return c ? c.name : id; };
  const go = btn(swapOut && swapIn ? '入れ替える: ' + nm(s.main, swapOut) + ' ⇄ ' + nm(s.side, swapIn) : '出すカードと入れるカードを選ぶ',
    '1 対 1 で入れ替える。入れ替えの後のデッキが Constructed で合法かどうかは、Lean が確かめる（TR 403.4.c）',
    () => liveSwap());
  go.disabled = !(swapOut && swapIn);
  group('入れ替え', [go]);
}
async function liveSwap() {
  const out = swapOut, inn = swapIn; undoCount = 0;
  $('livemsg').textContent = '確かめ中…';
  try {
    const j = await api('/api/swap', { out, in: inn });
    setLive(j); renderLegal(steps.length - 1);
    $('livemsg').textContent = '入れ替えた。続けて入れ替えるか、「次のゲーム」へ。';
  } catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function startWith(path, body, fresh) {
  const j = await api(path, body);
  if (j.choice !== undefined) { askChoice = j.choice; renderLegal(steps.length - 1); return; }
  if (fresh) undoCount = 0;
  else if (path === '/api/act' || path === '/api/clock' || path === '/api/judge') undoCount++;
  if (fresh) load({ seed: j.seed, players: j.players, cards: j.cards, steps: j.steps });
  else { const from = steps.length - 1; appendSteps(j.steps); pause(); show(from, false); }
  setLive(j); if (fresh) { speed = +$('speed').value; play(); } else play();
}
async function liveStart() {
  $('livemsg').textContent = '準備中…'; $('matchinfo').textContent = '';
  try {
    await startWith('/api/start', { seed: +$('seed').value, humans: $('seat').value,
      kind: $('kind').value, match: $('matchmode').value }, true);
  } catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function liveAct(k) {
  clearActMarks(); $('choices').textContent = ''; $('livemsg').textContent = '計算中…';
  try { await startWith('/api/act', { k }, false); }
  catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function liveExternal(which) {
  $('choices').textContent = ''; $('livemsg').textContent = '計算中…';
  try { await startWith('/api/' + which, {}, false); }
  catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function liveNext(choice) {
  $('choices').textContent = ''; $('livemsg').textContent = '準備中…';
  try { await startWith('/api/next', choice ? { choice } : {}, true); }
  catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
// 直前の答えを取り消す: Lean が、答える前のゲームに戻す。画面は、その手までの記録に切り詰める。
async function liveUndo() {
  if (!live || undoCount <= 0) return;
  clearActMarks(); $('choices').textContent = ''; $('livemsg').textContent = '戻しています…';
  try {
    const j = await api('/api/undo', {});
    pause(); undoCount--;
    const n = j.truncate; steps.length = n;
    const lis = $('log').children; while (lis.length > n) lis[lis.length - 1].remove();
    $('scrub').max = n - 1; setLive(j);
    buildBoard(); cur = 0; show(n - 1, false);
  } catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; renderLegal(steps.length - 1); }
}
$('undobtn').addEventListener('click', liveUndo);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && live && undoCount > 0
      && !(e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))) { e.preventDefault(); liveUndo(); }
});
$('newgame').addEventListener('click', liveStart);
async function detectLive() {
  try {
    const r = await fetch('/api/ping');
    if (!r.ok || !(await r.json()).live) return;
    live = true; $('live').hidden = false; $('empty').hidden = true;
    $('newgame').focus();
  } catch (e) { /* 橋渡しが無い: 再生だけ */ }
}
loadArtFile();
if (EMBEDDED) load(EMBEDDED); else { $('empty').hidden = false; detectLive(); }
</script>
