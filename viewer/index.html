<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound トレースビューア</title>
<style>
:root {
  --bg: #f6f5f2; --fg: #1d2126; --muted: #626b75; --panel: #ffffff; --line: #d9d6cf;
  --felt: #e9ece6; --accent: #2b5f8c; --card: #fdfdfb; --card-line: #b9b5ab;
  --fury: #c4452f; --calm: #2f87ab; --mind: #7d5bb8; --body: #4b9348; --chaos: #c9822a; --order: #b49c2c;
  --font: "Inter", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ch: clamp(50px, 9.2vh, 88px); --cw: calc(var(--ch) * .74);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171a; --fg: #e5e8ea; --muted: #97a1ab; --panel: #1c2024; --line: #333940;
  --felt: #1a2420; --accent: #7db4e0; --card: #272c31; --card-line: #4a525a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14171a; --fg: #e5e8ea; --muted: #97a1ab; --panel: #1c2024; --line: #333940;
  --felt: #1a2420; --accent: #7db4e0; --card: #272c31; --card-line: #4a525a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font);
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px)); }
/* 1 画面に収める: 縦に並べ、盤面（.layout）が余りを使い、足りなければ盤面の中だけが動く */
.app { margin: 0 auto; display: flex; flex-direction: column; gap: 6px;
  height: calc(100dvh - 16px); min-height: 520px; }
.app > * { flex: none; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font-size: 1rem; margin: 0; }
.status { color: var(--muted); font-variant-numeric: tabular-nums; }
.phases { display: flex; flex-wrap: wrap; gap: 4px; }
.phase { padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted);
  font-size: .74rem; transition: background .2s, color .2s; }
.phase.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.layout { flex: 1 1 0 !important; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 8px; align-items: stretch; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .app { height: auto; } }
.board { display: grid; gap: 6px; min-height: 0; overflow: auto; align-content: start; }
.midrow { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 6px; }
.seat { background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px;
  display: grid; grid-template-columns: 78px minmax(0, 1fr) minmax(0, 1.3fr); gap: 4px 6px; transition: box-shadow .25s, border-color .25s; }
.seat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.seat-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.seat-head h2 { font-size: .95rem; margin: 0; }
.pts { font-variant-numeric: tabular-nums; color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 1px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line);
  font-size: .82rem; font-variant-numeric: tabular-nums; }
.chip.energy { border-color: var(--accent); }
.chip.pop { animation: pop .45s ease; }
@keyframes pop { 40% { transform: scale(1.25); background: var(--accent); color: var(--bg); } }
.piles { display: flex; flex-wrap: wrap; gap: 3px 5px; margin-left: auto; }
.pile { display: flex; align-items: baseline; gap: 4px; border: 1px dashed var(--card-line); border-radius: 6px;
  padding: 0 6px; font-size: .68rem; color: var(--muted); }
.pile b { font-size: .85rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.pile.zero { opacity: .45; }
.lane { min-height: calc(var(--ch) + 18px); border-radius: 6px; padding: 14px 4px 4px; position: relative;
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; background: color-mix(in srgb, var(--panel) 55%, transparent); }
.lane::before { content: attr(data-label); position: absolute; top: 2px; left: 8px; font-size: .7rem;
  color: var(--muted); letter-spacing: .04em; }
.lane > .grp { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; position: relative; }
.lane > .grp:empty { display: none; }
.lane > .grp.runes { padding: 12px 4px 3px; border: 1px dashed var(--card-line); border-radius: 6px; }
.lane > .grp.runes::before { content: attr(data-label); position: absolute; top: 0; left: 6px; font-size: .62rem; color: var(--muted); }
.lane.bfs { background: transparent; padding: 14px 0 0; gap: 6px; }
.bf { flex: 1 1 160px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px 5px;
  background: color-mix(in srgb, var(--panel) 55%, transparent); transition: border-color .25s, box-shadow .25s; }
.bf.mine0 { border-color: var(--accent); } .bf.mine1 { border-color: var(--chaos); }
.bf.contested { box-shadow: 0 0 0 2px var(--fury) inset; }
.bf-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: .78rem; margin-bottom: 6px; }
.bf-cards { display: flex; flex-wrap: wrap; gap: 6px; min-height: var(--ch); }
.tag { padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); font-size: .72rem; color: var(--muted); }
.tag.ctl0 { border-color: var(--accent); color: var(--accent); }
.tag.ctl1 { border-color: var(--chaos); color: var(--chaos); }
.tag.hot { border-color: var(--fury); color: var(--fury); }
.card.bfcard .card-in { border-style: double; border-width: 3px; }
.card .bst { position: absolute; left: 3px; top: 3px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--accent); color: #fff; }
.card .stn { position: absolute; left: 3px; top: 20px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--chaos, #7a4fa0); color: #fff; }
.card .eqp { position: absolute; right: 3px; bottom: 3px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--calm, #2c5f8a); color: #fff; }
.card.ability .card-in { border-style: dashed; border-width: 2px; }
.card .ab { position: absolute; left: 4px; bottom: 3px; font-size: .62rem; padding: 0 5px; border-radius: 99px;
  background: var(--fury); color: #fff; }
.card { width: var(--cw); height: var(--ch); position: relative; }
.card-in { width: 100%; height: 100%; border: 1px solid var(--card-line); border-radius: 5px; background: var(--card);
  padding: 2px 3px; font-size: .64rem; line-height: 1.2; overflow: hidden; display: flex; flex-direction: column;
  justify-content: space-between; transition: transform .3s ease, opacity .3s; }
.card-in.exh { transform: rotate(90deg) scale(.82); opacity: .6; }
.card .nm { font-weight: 600; overflow-wrap: anywhere; }
.card .st { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
.card.rune .card-in { border-width: 2px; }
.card.rune .nm { text-align: center; margin-block: auto; }
.card .dmg { position: absolute; right: -4px; top: -4px; background: var(--fury); color: #fff; border-radius: 99px;
  padding: 0 5px; font-size: .65rem; }
.d-fury { border-color: var(--fury) !important; } .d-calm { border-color: var(--calm) !important; }
.d-mind { border-color: var(--mind) !important; } .d-body { border-color: var(--body) !important; }
.d-chaos { border-color: var(--chaos) !important; } .d-order { border-color: var(--order) !important; }
.side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 0; }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-height: 24dvh; overflow: auto; }
.now b { display: block; margin-bottom: 2px; }
.now small { color: var(--muted); }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 0; overflow-y: auto;
  margin: 0; padding: 4px; list-style: none; }
.log li { padding: 1px 8px; border-radius: 5px; cursor: pointer; font-size: .74rem; color: var(--muted); }
.log li:hover { background: var(--bg); }
.log li.cur { background: var(--accent); color: var(--bg); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; }
button, select { font: inherit; font-size: .8rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#scrub { flex: 1 1 200px; min-width: 120px; }
.banner { background: var(--accent); color: var(--bg); padding: 2px 12px; border-radius: 8px; font-weight: 600; }
#fly { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 8px; }
[hidden] { display: none !important; }
.note { color: var(--muted); font-size: .74rem; }
#cardinfo { position: fixed; z-index: 60; width: 330px; max-height: min(82dvh, 580px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .4); font-size: .8rem; }
#cardinfo h2 { margin: 0; font-size: 1rem; }
#cardinfo .sub { color: var(--muted); margin-bottom: 4px; }
#cardinfo dl { display: grid; grid-template-columns: 5.2em 1fr; gap: 2px 8px; margin: 6px 0; }
#cardinfo dt { color: var(--muted); } #cardinfo dd { margin: 0; }
#cardinfo pre { margin: 6px 0 0; padding: 6px; background: var(--bg); border-radius: 6px; font: .68rem/1.35 var(--mono);
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
#cardinfo .x { float: right; padding: 0 7px; }
.card { cursor: context-menu; }
.card.act { cursor: pointer; outline: 2px solid var(--accent); outline-offset: 1px; }
.card.act:hover, .card.act:focus-visible { outline-width: 3px; transform: translateY(-3px); }
#actmenu { position: fixed; z-index: 65; display: grid; gap: 3px; padding: 6px; max-width: min(360px, 92vw);
  max-height: min(70dvh, 480px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, .4); font-size: .8rem; }
#actmenu h3 { margin: 0 2px 2px; font-size: .72rem; color: var(--muted); font-weight: 600; }
#actmenu button { text-align: left; }
.card-in { position: relative; }
.card-in > .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; border-radius: 4px; }
.card-in > :not(.art) { position: relative; z-index: 1; }
.card.hasart .nm, .card.hasart .st { background: color-mix(in srgb, var(--card) 78%, transparent); border-radius: 3px; }
.card.hasart .st { align-self: stretch; }
#cardinfo .artbox { display: grid; gap: 4px; margin: 6px 0; }
#cardinfo .artbox img { width: 100%; max-height: 240px; object-fit: contain; border-radius: 6px; background: var(--bg); }

.note.foot { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; display: grid; gap: 3px;
  max-height: 40dvh; overflow: auto; }
.live .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.live input[type=number] { width: 4.5em; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.choices { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; }
.choices h3 { margin: 0; font-size: .72rem; color: var(--muted); font-weight: 600; }
.choices .btns { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.choices button { text-align: left; }
.choices button.danger { border-color: var(--fury); color: var(--fury); }
.choices button.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <header class="top">
      <h1>Riftbound トレースビューア</h1>
      <span class="status" id="status"></span>
    </header>
    <div class="phases" id="phases"></div>
  </div>
  <div class="empty" id="empty" hidden>
    <p><code>riftbound-trace</code> が書き出した JSON を選んでください。</p>
    <input type="file" id="file" accept=".json,application/json" aria-label="トレースの JSON">
  </div>
  <section class="live" id="live" hidden aria-label="ライブ操作">
    <div class="row">
      <b>ライブ操作</b>
      <label>seed <input type="number" id="seed" value="1" min="0"></label>
      <label>操作する席 <select id="seat"><option value="0" selected>P0（P1 は自動）</option>
        <option value="1">P1（P0 は自動）</option><option value="01">両方</option></select></label>
      <label>ルール <select id="kind"><option value="core" selected>Core Rules（デモ）</option>
        <option value="constructed">大会: Constructed</option><option value="sealed">大会: Sealed（Legend なし）</option>
        <option value="draft">大会: Draft（Legend なし）</option></select></label>
      <label>試合 <select id="matchmode"><option value="single" selected>1 ゲームだけ</option>
        <option value="bo1">Best of 1</option><option value="bo3">Best of 3</option></select></label>
      <button id="newgame">新しいゲーム</button>
      <span class="note" id="livemsg"></span>
    </div>
    <div class="note" id="matchinfo"></div>
    <div class="choices" id="choices" aria-live="polite"></div>
  </section>
  <div id="result" class="banner" hidden></div>
  <div class="layout" id="layout" hidden>
    <div class="board" id="board"></div>
    <div class="side">
      <div class="now" id="now"></div>
      <ol class="log" id="log"></ol>
    </div>
  </div>
  <div class="controls" id="controls" hidden>
    <button id="first" aria-label="最初へ">⏮</button>
    <button id="prev" aria-label="1 手戻る">◀</button>
    <button id="play" aria-label="再生">▶ 再生</button>
    <button id="next" aria-label="1 手進む">▶|</button>
    <button id="last" aria-label="最後へ">⏭</button>
    <input type="range" id="scrub" min="0" value="0" aria-label="手の位置">
    <label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option></select></label>
  </div>
  <p class="note foot">このビューアにルールはありません。見えているものはすべて Lean のエンジン（<code>step</code>）が
    計算した結果の再生です。ただし、この描画のコードは Lean の証明の対象外です。</p>
</div>
<div id="fly"></div>
<div id="cardinfo" hidden role="dialog" aria-label="カードの詳細"></div>
<div id="actmenu" hidden role="menu" aria-label="このカードで選べる手"></div>
<script>
const EMBEDDED = /*__TRACE__*/null;
const $ = (id) => document.getElementById(id);
const PHASES = ['setup', 'awaken', 'beginning', 'channel', 'draw', 'main', 'ending'];
const PHASE_JA = { setup: '準備', awaken: 'Awaken', beginning: 'Beginning', channel: 'Channel', draw: 'Draw', main: 'Main', ending: 'Ending' };
const PILES = [['championZone', 'Champion'], ['mainDeck', 'Main Deck'], ['runeDeck', 'Rune Deck'], ['trash', 'Trash'],
  ['banishment', 'Banish'], ['setAside', '脇に置いた札'], ['outOfGame', 'ゲーム外']];
const LANES = [['legendZone', 'Legend'], ['base', 'Base'], ['hand', 'Hand']];
const DOMAINS = ['fury', 'calm', 'mind', 'body', 'chaos', 'order'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let trace, steps, cards, objs, cur = 0, playing = false, timer = null, speed = 1;
const els = new Map();        // object id -> card element
const zoneBox = new Map();    // zone name -> container element
const poolBox = [], pointsBox = [], seatBox = [];
const bfGroup = new Map();    // Battlefield id -> its column

function cardName(id) { const o = objs[id]; return o ? (cards[o.card] ? cards[o.card].name : o.card) : '#' + id; }
function dur() { return reduce ? 0 : 480 / speed; }

function load(t) {
  pause(); cur = 0;
  trace = t; steps = t.steps; cards = t.cards; objs = {};
  for (const s of steps) for (const [id, o] of Object.entries(s.state.new)) objs[id] = o;
  buildBoard(); buildLog();
  $('empty').hidden = true; $('layout').hidden = false; $('controls').hidden = false;
  $('scrub').max = steps.length - 1;
  show(0, false);
}

const baseGroups = new Map();
function buildBoard() {
  baseGroups.clear();
  const board = $('board'); board.textContent = ''; els.clear(); zoneBox.clear();
  poolBox.length = pointsBox.length = seatBox.length = 0;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const seat = (p) => {
    const s = mk('section', 'seat'); seatBox[p] = s;
    const head = mk('div', 'seat-head'); head.append(mk('h2', '', 'P' + p));
    pointsBox[p] = mk('span', 'pts'); poolBox[p] = mk('div', 'pool'); head.append(pointsBox[p], poolBox[p]);
    const piles = mk('div', 'piles');
    for (const [k, label] of PILES) {
      const e = mk('div', 'pile'); e.append(mk('span', '', label), mk('b', '', '0'));
      zoneBox.set('p' + p + '.' + k, e); piles.append(e);
    }
    head.append(piles); s.append(head);
    for (const [k, label] of LANES) {
      const l = mk('div', 'lane'); l.dataset.label = label; zoneBox.set('p' + p + '.' + k, l); s.append(l);
      if (k === 'base') {
        // Runes and the other cards at Base sit in separate groups, so they are not mixed up.
        const rg = mk('div', 'grp runes'); rg.dataset.label = 'Rune'; const og = mk('div', 'grp others');
        l.append(rg, og); baseGroups.set('p' + p + '.base', { runes: rg, others: og });
      }
    }
    return s;
  };
  board.append(seat(0));
  const mid = mk('div', 'midrow');
  const bf = mk('div', 'lane bfs'); bf.dataset.label = 'Battlefield'; zoneBox.set('battlefield', bf); mid.append(bf);
  bfGroup.clear();
  const ch = mk('div', 'lane'); ch.dataset.label = 'Chain'; zoneBox.set('chain', ch); mid.append(ch);
  board.append(mid);
  for (let p = 1; p < trace.players; p++) board.append(seat(p));
  const ph = $('phases'); ph.textContent = '';
  for (const k of PHASES) { const e = mk('span', 'phase', PHASE_JA[k]); e.dataset.phase = k; ph.append(e); }
}

function describe(i) {
  const a = steps[i].action;
  if (!a) return ['ゲーム開始前', '山札・Rune Deck・Battlefield の準備ができた状態'];
  return describeA(a, i > 0 ? steps[i - 1].state.pending : null);
}

// 答え a の説明。prev は、答える前に開いていた質問（フレーム）の名前。
function describeA(a, prev) {
  const who = a.actor === 'chance' ? '乱数' : a.actor === 'clock' ? '時計' : a.actor === 'judge' ? 'ジャッジ' : 'P' + a.actor.slice(1);
  switch (a.kind) {
    case 'arrange': return [who + ': 並び替え', 'シャッフル、または Recycle の順番'];
    case 'arrangePlayers': return [who + ': 手番順を決める', 'ターン順が決まった'];
    case 'pick': return [who + ': Battlefield を選ぶ', '抽選で Battlefield が場に出る'];
    case 'mulliganDone': return [who + ': マリガンしない', '手札を確定した'];
    case 'discardDone': return [who + ': 捨てるカードがない', '手札が空なので捨てる処理を終える'];
    case 'discardPick': return [who + ': ' + cardName(a.card) + ' を捨てる', cardName(a.card) + ' を手札から Trash へ'];
    case 'mulliganPick': return [who + ': ' + cardName(a.card) + ' をマリガン', cardName(a.card) + ' を脇に置く'];
    case 'burnOutTarget': return [who + ': Burn Out の相手を選ぶ', 'P' + a.opponent + ' が 1 点を得る'];
    case 'assignPick':
      return [who + ': ' + cardName(a.unit) + ' に先にダメージを割り当てる', 'Combat Damage: 致死ダメージを与える順に、相手の Unit を選ぶ（Tank が先）'];
    case 'assignDone':
      return [who + ': 割り当てを確定', '選んだ順に致死ダメージを割り当て、残りは最後の Unit へ。両陣営が終えると同時に与える'];
    case 'standardMove':
      return [who + ': ' + cardName(a.unit) + ' を Standard Move',
        (a.dest === null ? 'Base へ戻る' : cardName(a.dest) + ' へ移動する') + '（Unit は Exhaust する）'];
    case 'pass':
      if (prev === 'showdown') return [who + ': パス', 'Showdown でパス（全員がパスすると、Unit が 1 人だけなら Control と Conquer、2 人いれば Combat Damage）'];
      if (prev === 'chainPass') return [who + ': パス', 'Chain の項目に応答しない（全員がパスすると、いちばん上の項目が解決する）'];

        return [who + ': ' + cardName(a.card) + (react ? ' を Reaction でプレイ' : ' をプレイ') + more + (tg ? '（対象: ' + tg + '）' : ''),

      }

        more ? 'コストと追加コストを払って Base に出す（Accelerate で払えば ready で入る）'

function zoneOfPrev(prevState, id) {

function show(i, animate) {
  const prevI = cur, prev = steps[prevI].state, s = steps[i], st = s.state;
  animate = animate && !reduce && i === prevI + 1;
  const prevRects = new Map();
  if (animate) for (const [id, e] of els) prevRects.set(id, rectOf(e));
  const pileRect = (zone) => { const b = zoneBox.get(zone); return b ? rectOf(b) : null; };
  const events = animate ? s.events.filter((e) => e.t === 'moved') : [];
  const fromNew = new Map(events.map((e) => [e.new, e.old])), toDst = new Map(events.map((e) => [e.old, e.dst]));

  const want = new Set();
  for (const z of visibleZones()) for (const id of (st.zones[z] || [])) want.add(id);
  // objects that left the visible lanes
  for (const [id, e] of [...els]) {
    if (want.has(id)) continue;
    els.delete(id);
    const dst = toDst.get(id), dstRect = dst && !visibleZones().includes(dst) ? pileRect(dst) : null;
    if (animate && prevRects.has(id) && dstRect) fly(e, prevRects.get(id), dstRect);
    e.remove();
  }
  // lay out the lanes in order
  for (const z of visibleZones()) {
    const box = zoneBox.get(z); if (!box) continue;
    if (z === 'battlefield') { layoutBattlefields(box, st); continue; }
    const grp = baseGroups.get(z);
    for (const id of (st.zones[z] || [])) {
      let e = els.get(id); if (!e) { e = makeCard(id); els.set(id, e); }
      (grp ? (e.classList.contains('rune') ? grp.runes : grp.others) : box).append(e); decorate(e, st, id);
    }
  }
  // animate what moved
  if (animate) for (const [id, e] of els) {
    const nr = rectOf(e); let from = null, fade = false;
    if (prevRects.has(id)) from = prevRects.get(id);
    else {
      const old = fromNew.get(id);
      if (old !== undefined && prevRects.has(old)) from = prevRects.get(old);
      else { const z = zoneOfPrev(prev, old !== undefined ? old : id); from = z ? pileRect(z) : null; fade = true; }
    }
    if (!from) { e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur() }); continue; }
    const dx = from.left - nr.left, dy = from.top - nr.top;
    if (!dx && !dy && !fade) continue;
    e.style.zIndex = 5;
    e.animate([{ transform: `translate(${dx}px,${dy}px)`, opacity: fade ? 0.2 : 1 }, { transform: 'translate(0,0)', opacity: 1 }],
      { duration: dur(), easing: 'cubic-bezier(.2,.8,.2,1)' }).finished.then(() => { e.style.zIndex = ''; }, () => {});
  }
  renderStatic(i, st, prev, animate);
  cur = i;
}

function fly(src, from, to) {
  const c = src.cloneNode(true); c.style.cssText = `position:fixed;left:${from.left}px;top:${from.top}px;margin:0`;
  $('fly').append(c);
  c.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${to.left - from.left}px,${to.top - from.top}px) scale(.6)`, opacity: 0.1 }],
    { duration: dur(), easing: 'ease-in' }).finished.then(() => c.remove(), () => c.remove());
}

function renderStatic(i, st, prev, animate) {

  for (const e of steps[i].events) {

  }

  const cl = document.querySelector('#log li.cur'), log = $('log');

function pause() { playing = false; clearTimeout(timer); $('play').textContent = '▶ 再生'; $('play').setAttribute('aria-label', '再生'); }
function play() {
  if (cur >= steps.length - 1) show(0, false);
  playing = true; $('play').textContent = '⏸ 停止'; $('play').setAttribute('aria-label', '停止'); tick();
}
function tick() {
  if (!playing) return;

  show(cur + 1, true);
  const s = steps[cur], busy = s.events.length > 0 || s.action && (s.action.kind === 'runeAbility' || s.action.kind === 'playCard') || s.action && s.action.kind === 'pass';
  timer = setTimeout(tick, (busy ? 800 : 160) / speed);

$('play').addEventListener('click', () => (playing ? pause() : play()));
$('next').addEventListener('click', () => { pause(); if (cur < steps.length - 1) show(cur + 1, true); });
$('prev').addEventListener('click', () => { pause(); if (cur > 0) show(cur - 1, false); });

$('last').addEventListener('click', () => { pause(); show(steps.length - 1, false); });

document.addEventListener('keydown', (e) => {

// ---- カードの右クリックで詳細 ----
const ZONE_JA = { hand: '手札', base: 'Base', trash: 'Trash', mainDeck: 'Main Deck', runeDeck: 'Rune Deck', legendZone: 'Legend',
  championZone: 'Champion', banishment: 'Banish', setAside: '脇に置いた札', outOfGame: 'ゲーム外' };
const DOMAIN_JA = { fury: 'Fury', calm: 'Calm', mind: 'Mind', body: 'Body', chaos: 'Chaos', order: 'Order', any: '任意', own: '自分のドメイン' };
function costText(c) {

  const parts = []; if (c.energy || !c.power.length) parts.push('Energy ' + c.energy);
  for (const s of c.power) parts.push('Power(' + (DOMAIN_JA[s] || s) + ')');
  return parts.join(' + ');
}
// Card art: viewer/art.json (served by the bridge at /art.json) maps a card id to an image URL.
// Only http(s) URLs are used. A card that has no entry, or whose image fails to load, stays a text card.
let artFile = {};
function artUrl(cid) { const u = artFile[cid]; return typeof u === 'string' && /^https?:\/\/\S+$/i.test(u) ? u : null; }
function applyArt(el) {
  const o = objs[el.dataset.id], u = o && artUrl(o.card), inn = el.firstChild;
  let img = inn.querySelector(':scope > .art');
  if (!u) { if (img) img.remove(); el.classList.remove('hasart'); return; }
  if (!img) {
    img = document.createElement('img'); img.className = 'art'; img.alt = ''; img.referrerPolicy = 'no-referrer'; img.loading = 'lazy';
    img.addEventListener('error', () => { img.remove(); el.classList.remove('hasart'); });

}
function applyArtAll() { document.querySelectorAll('.card').forEach(applyArt); }
async function loadArtFile() {
  try {
    const r = await fetch('/art.json'); if (!r.ok) return;
    const j = await r.json(); if (j && typeof j === 'object' && !Array.isArray(j)) { artFile = j; applyArtAll(); }
  } catch (_) { /* 橋渡しが無い、または art.json が無い */ }
}
function artBox(el, cid) {

  im.addEventListener('error', () => wrap.remove()); wrap.append(im); return wrap;
}

function hideCardInfo() { $('cardinfo').hidden = true; }
function showCardInfo(id, x, y) {

  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(x + 10, innerWidth - w - 8)) + 'px';
  box.style.top = Math.max(8, Math.min(y + 10, innerHeight - h - 8)) + 'px';
}
document.addEventListener('contextmenu', (e) => {
  const c = e.target.closest && e.target.closest('.card');
  if (!c || !steps || !c.dataset.id || e.target.closest('#cardinfo')) return;
  e.preventDefault(); showCardInfo(c.dataset.id, e.clientX, e.clientY);
});
document.addEventListener('click', (e) => { if (!e.target.closest('#cardinfo')) hideCardInfo(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCardInfo(); });
$('board').addEventListener('scroll', hideCardInfo);

// ---- ライブ操作: ローカルの橋渡し（scripts/live.py）が、Lean の riftbound-live につなぐ ----
// 画面にルールは無い。合法手（legalActions）と、答えの結果（step）は Lean が決め、ここは描くだけ。
let live = false, liveLegal = [], liveMatch = null, liveExt = { clock: false, judge: false }, askChoice = null;
let liveSide = null, swapOut = null, swapIn = null;
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}) });
  let j;
  try { j = JSON.parse(await r.text()); }
  catch (e) { throw new Error('ライブ操作の橋渡し（scripts/live.py）につながっていない'); }
  if (j.error) throw new Error(j.error);
  return j;
}
function appendSteps(list) {
  for (const s of list) {
    steps.push(s);
    for (const [id, o] of Object.entries(s.state.new)) objs[id] = o;
    const i = steps.length - 1, li = document.createElement('li');
    li.textContent = i + '. ' + describe(i)[0];
    li.addEventListener('click', () => { pause(); show(i, false); }); $('log').append(li);
  }
  $('scrub').max = steps.length - 1;
}
function setLive(j) {
  liveLegal = j.legal; liveMatch = j.match; liveExt = j.external; liveSide = j.sideboard; askChoice = null;
  swapOut = swapIn = null;
}
function matchText(m) {
  if (!m) return '';
  const order = m.order === 'chance' ? '最初のゲーム: 抽選で選ばれた人が先手か後手かを選ぶ（TR 407）'
    : m.order.startsWith('loser') ? '次のゲーム: 負けた P' + m.order.slice(5) + ' が先手か後手かを選ぶ（TR 407）'
    : '次のゲーム: 引き分けの後なので、先手は同じ P' + m.order.slice(4) + '（TR 407）';
  return 'Best of ' + (m.target * 2 - 1) + ' ・ 勝ち P0 ' + m.wins[0] + ' - P1 ' + m.wins[1] + ' ・ ' + m.games + ' ゲーム'
    + (m.finished ? ' ・ マッチ終了: 勝者 P' + m.winner : ' ・ ' + order
      + ' ・ サイドボード: ' + (m.sideboard ? '使える' : '使えない') + (m.sameBattlefields ? ' ・ 同じ Battlefield' : ''));
}
// 手とカードの結びつき: カードをクリックして答える。手が 1 つならすぐ、複数ならメニューで選ぶ。
// 結びつけるのは、盤面にそのカードがあるときだけ（無ければボタンのまま）。
function actCard(a) {
  switch (a.kind) {
    case 'runeAbility': case 'playCard': case 'mulliganPick': case 'discardPick': return a.card;
    case 'standardMove': case 'assignPick': return a.unit;
    case 'manaAbility': case 'activate': return a.source;
    default: return null;
  }
}
let cardActs = new Map(), showAllMoves = false;
function clearActMarks() {
  cardActs = new Map(); hideActMenu();
  document.querySelectorAll('.card.act').forEach((c) => { c.classList.remove('act'); c.removeAttribute('tabindex'); });
}
function markActCards(list) {
  clearActMarks();
  for (const l of list) {
    const id = actCard(l.a); if (id === null || id === undefined) continue;
    const c = document.querySelector('.card[data-id="' + id + '"]'); if (!c) continue;
    if (!cardActs.has(String(id))) cardActs.set(String(id), []);
    cardActs.get(String(id)).push(l);
    c.classList.add('act'); c.tabIndex = 0;
  }
}
function hideActMenu() { const m = $('actmenu'); if (m) m.hidden = true; }
function chooseCard(c, x, y) {
  const list = cardActs.get(c.dataset.id); if (!list || !live) return;
  if (list.length === 1) { hideActMenu(); liveAct(list[0].k); return; }
  const m = $('actmenu'); m.textContent = '';
  const h = document.createElement('h3'); h.textContent = cardName(c.dataset.id) + ' で選べる手（' + list.length + ' 個）'; m.append(h);
  for (const l of list) {
    const [title, detail] = describeA(l.a, steps[steps.length - 1].state.pending);
    const b = document.createElement('button'); b.textContent = title.replace(/^P\d: /, ''); b.title = detail || '';
    b.addEventListener('click', (e) => { e.stopPropagation(); hideActMenu(); liveAct(l.k); });
    m.append(b);
  }
  m.hidden = false;
  const w = m.offsetWidth, hh = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x + 6, innerWidth - w - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y + 6, innerHeight - hh - 8)) + 'px';
  const f = m.querySelector('button'); if (f) f.focus();
}
document.addEventListener('click', (e) => {
  const c = e.target.closest && e.target.closest('.card.act');
  if (c && !e.target.closest('#actmenu')) { e.stopPropagation(); chooseCard(c, e.clientX, e.clientY); return; }
  if (!e.target.closest('#actmenu')) hideActMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideActMenu();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('act')) {
    e.preventDefault(); const r = e.target.getBoundingClientRect(); chooseCard(e.target, r.left + r.width / 2, r.top + r.height / 2);
  }
});

function renderLegal(i) {
  const box = $('choices'); box.textContent = '';
  clearActMarks();
  if (!live || !steps || i !== steps.length - 1) return;
  const last = steps[i].state;
  $('matchinfo').textContent = matchText(liveMatch);
  const btn = (text, title, fn, cls) => {
    const b = document.createElement('button'); b.textContent = text; b.title = title || '';
    if (cls) b.classList.add(cls); b.addEventListener('click', fn); return b;
  };
  const group = (title, buttons) => {
    const h = document.createElement('h3'); h.textContent = title;
    const row = document.createElement('div'); row.className = 'btns'; row.append(...buttons); box.append(h, row);
  };
  if (last.result) {
    if (liveMatch && !liveMatch.finished) {
      if (askChoice !== null) {
        $('livemsg').textContent = 'P' + askChoice + ' が、次のゲームの先手か後手かを選ぶ（TR 407）';
        group('P' + askChoice + ' の選択', [
          btn('先手にする', '次のゲームで、先に動く', () => liveNext('first')),
          btn('後手にする', '次のゲームで、後に動く', () => liveNext('second'))]);
      } else {
        $('livemsg').textContent = 'このゲームは終わった。マッチは続く。';
        if (liveSide && liveSide.allowed) renderSideboard(group, btn);
        group('マッチ', [btn('次のゲーム', '結果をマッチに数えて、次のゲームを始める', () => liveNext(null))]);
      }
    } else {
      $('livemsg').textContent = liveMatch ? 'マッチ終了。「新しいゲーム」で、もう一度始められる。'
        : 'ゲーム終了。「新しいゲーム」で、もう一度始められる。';
    }
    return;
  }
  markActCards(liveLegal);
  const bound = (l) => { const id = actCard(l.a); return id !== null && id !== undefined && cardActs.has(String(id)); };
  const nBound = liveLegal.filter(bound).length;
  const by = new Map();
  for (const l of liveLegal) {
    if (bound(l) && !showAllMoves) continue;
    if (!by.has(l.a.actor)) by.set(l.a.actor, []); by.get(l.a.actor).push(l);
  }
  $('livemsg').textContent = liveLegal.length ? '答えを選ぶ（' + liveLegal.length + ' 個）' +
    (nBound && !showAllMoves ? ': 青い枠のカードをクリック、または下のボタン' : '') : '';
  for (const [actor, list] of by) {
    group('P' + actor.slice(1) + ' の合法手', list.map((l) => {
      const [title, detail] = describeA(l.a, last.pending);
      return btn(title.replace(/^P\d: /, ''), detail, () => liveAct(l.k), l.a.kind === 'concede' ? 'danger' : null);
    }));
  }
  if (nBound) group('表示', [btn(showAllMoves ? 'カードの手を、ボタンから隠す' : 'カードの手も、ボタンで全部出す',
    'カードをクリックしても同じ手を選べる', () => { showAllMoves = !showAllMoves; renderLegal(steps.length - 1); })]);
  const ext = [];
  if (liveExt.clock) ext.push(btn('時計: 時間切れを知らせる', '今のターンを最後まで行い、さらに 3 ターン行って終わる（TR 408.2）', () => liveExternal('clock')));
  if (liveExt.judge) ext.push(btn('ジャッジ: 引き分けを宣言する', '選手の合意、または終わらないループ（TR 410.1、505.6）', () => liveExternal('judge'), 'danger'));
  if (ext.length) group('大会のルール', ext);
}
// サイドボード（TR 403.4）: Main Deck のカードを 1 枚出し、サイドボードのカードを 1 枚入れる。合法かどうかは Lean が決める。
function renderSideboard(group, btn) {
  const s = liveSide;
  const cardBtns = (list, sel, set) => list.map((c) =>
    btn(c.name + ' ×' + c.n, c.id, () => { set(sel === c.id ? null : c.id); renderLegal(steps.length - 1); },
      sel === c.id ? 'sel' : null));
  group('サイドボード（P' + s.player + '）: Main Deck ' + s.mainCount + ' 枚 ／ サイドボード ' + s.sideCount + ' 枚',
    []);
  group('出すカード（Main Deck）', cardBtns(s.main, swapOut, (v) => { swapOut = v; }));
  group('入れるカード（サイドボード）', cardBtns(s.side, swapIn, (v) => { swapIn = v; }));
  const nm = (list, id) => { const c = list.find((x) => x.id === id); return c ? c.name : id; };
  const go = btn(swapOut && swapIn ? '入れ替える: ' + nm(s.main, swapOut) + ' ⇄ ' + nm(s.side, swapIn) : '出すカードと入れるカードを選ぶ',
    '1 対 1 で入れ替える。入れ替えの後のデッキが Constructed で合法かどうかは、Lean が確かめる（TR 403.4.c）',
    () => liveSwap());
  go.disabled = !(swapOut && swapIn);
  group('入れ替え', [go]);
}
async function liveSwap() {
  const out = swapOut, inn = swapIn;
  $('livemsg').textContent = '確かめ中…';
  try {
    const j = await api('/api/swap', { out, in: inn });
    setLive(j); renderLegal(steps.length - 1);
    $('livemsg').textContent = '入れ替えた。続けて入れ替えるか、「次のゲーム」へ。';
  } catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function startWith(path, body, fresh) {
  const j = await api(path, body);
  if (j.choice !== undefined) { askChoice = j.choice; renderLegal(steps.length - 1); return; }
  if (fresh) load({ seed: j.seed, players: j.players, cards: j.cards, steps: j.steps });
  else { const from = steps.length - 1; appendSteps(j.steps); pause(); show(from, false); }
  setLive(j); if (fresh) { speed = +$('speed').value; play(); } else play();
}
async function liveStart() {
  $('livemsg').textContent = '準備中…'; $('matchinfo').textContent = '';
  try {
    await startWith('/api/start', { seed: +$('seed').value, humans: $('seat').value,
      kind: $('kind').value, match: $('matchmode').value }, true);
  } catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function liveAct(k) {
  clearActMarks(); $('choices').textContent = ''; $('livemsg').textContent = '計算中…';
  try { await startWith('/api/act', { k }, false); }
  catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function liveExternal(which) {
  $('choices').textContent = ''; $('livemsg').textContent = '計算中…';
  try { await startWith('/api/' + which, {}, false); }
  catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
async function liveNext(choice) {
  $('choices').textContent = ''; $('livemsg').textContent = '準備中…';
  try { await startWith('/api/next', choice ? { choice } : {}, true); }
  catch (e) { $('livemsg').textContent = 'エラー: ' + e.message; }
}
$('newgame').addEventListener('click', liveStart);
async function detectLive() {
  try {
    const r = await fetch('/api/ping');
    if (!r.ok || !(await r.json()).live) return;
    live = true; $('live').hidden = false; $('empty').hidden = true;
    $('newgame').focus();
  } catch (e) { /* 橋渡しが無い: 再生だけ */ }
}
loadArtFile();
if (EMBEDDED) load(EMBEDDED); else { $('empty').hidden = false; detectLive(); }
</script>
</body>
