<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound トレースビューア</title>
<style>
:root {
  --bg: #f6f5f2; --fg: #1d2126; --muted: #626b75; --panel: #ffffff; --line: #d9d6cf;
  --felt: #e9ece6; --accent: #2b5f8c; --card: #fdfdfb; --card-line: #b9b5ab;
  --fury: #c4452f; --calm: #2f87ab; --mind: #7d5bb8; --body: #4b9348; --chaos: #c9822a; --order: #b49c2c;
  --font: "Inter", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --cw: 56px; --ch: 78px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171a; --fg: #e5e8ea; --muted: #97a1ab; --panel: #1c2024; --line: #333940;
  --felt: #1a2420; --accent: #7db4e0; --card: #272c31; --card-line: #4a525a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14171a; --fg: #e5e8ea; --muted: #97a1ab; --panel: #1c2024; --line: #333940;
  --felt: #1a2420; --accent: #7db4e0; --card: #272c31; --card-line: #4a525a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-size: 1.15rem; margin: 0; }
.status { color: var(--muted); font-variant-numeric: tabular-nums; }
.phases { display: flex; flex-wrap: wrap; gap: 4px; }
.phase { padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted);
  font-size: .8rem; transition: background .2s, color .2s; }
.phase.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.board { display: grid; gap: 10px; }
.seat { background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  display: grid; gap: 8px; transition: box-shadow .25s, border-color .25s; }
.seat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.seat-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.seat-head h2 { font-size: .95rem; margin: 0; }
.pts { font-variant-numeric: tabular-nums; color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 1px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line);
  font-size: .82rem; font-variant-numeric: tabular-nums; }
.chip.energy { border-color: var(--accent); }
.chip.pop { animation: pop .45s ease; }
@keyframes pop { 40% { transform: scale(1.25); background: var(--accent); color: var(--bg); } }
.piles { display: flex; flex-wrap: wrap; gap: 8px; }
.pile { width: 74px; min-height: 48px; border: 1px dashed var(--card-line); border-radius: 6px;
  padding: 4px 6px; font-size: .72rem; color: var(--muted); text-align: center; }
.pile b { display: block; font-size: 1.1rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.pile.zero { opacity: .45; }
.lane { min-height: calc(var(--ch) + 22px); border-radius: 6px; padding: 18px 6px 6px; position: relative;
  display: flex; flex-wrap: wrap; gap: 6px; background: color-mix(in srgb, var(--panel) 55%, transparent); }
.lane::before { content: attr(data-label); position: absolute; top: 2px; left: 8px; font-size: .7rem;
  color: var(--muted); letter-spacing: .04em; }
.card { width: var(--cw); height: var(--ch); position: relative; }
.card-in { width: 100%; height: 100%; border: 1px solid var(--card-line); border-radius: 6px; background: var(--card);
  padding: 4px; font-size: .68rem; line-height: 1.2; overflow: hidden; display: flex; flex-direction: column;
  justify-content: space-between; transition: transform .3s ease, opacity .3s; }
.card-in.exh { transform: rotate(90deg) scale(.82); opacity: .6; }
.card .nm { font-weight: 600; overflow-wrap: anywhere; }
.card .st { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
.card.rune .card-in { border-width: 2px; }
.card.rune .nm { text-align: center; margin-block: auto; }
.card .dmg { position: absolute; right: -4px; top: -4px; background: var(--fury); color: #fff; border-radius: 99px;
  padding: 0 5px; font-size: .65rem; }
.d-fury { border-color: var(--fury) !important; } .d-calm { border-color: var(--calm) !important; }
.d-mind { border-color: var(--mind) !important; } .d-body { border-color: var(--body) !important; }
.d-chaos { border-color: var(--chaos) !important; } .d-order { border-color: var(--order) !important; }
.side { display: grid; gap: 10px; }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 76px; }
.now b { display: block; margin-bottom: 2px; }
.now small { color: var(--muted); }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 420px; overflow-y: auto;
  margin: 0; padding: 4px; list-style: none; }
.log li { padding: 3px 8px; border-radius: 5px; cursor: pointer; font-size: .8rem; color: var(--muted); }
.log li:hover { background: var(--bg); }
.log li.cur { background: var(--accent); color: var(--bg); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
button, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#scrub { flex: 1 1 200px; min-width: 120px; }
.banner { background: var(--accent); color: var(--bg); padding: 8px 12px; border-radius: 8px; font-weight: 600; }
#fly { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 8px; }
.note { color: var(--muted); font-size: .78rem; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>Riftbound トレースビューア</h1>
    <span class="status" id="status"></span>
  </header>
  <div class="phases" id="phases"></div>
  <div class="empty" id="empty" hidden>
    <p><code>riftbound-trace</code> が書き出した JSON を選んでください。</p>
    <input type="file" id="file" accept=".json,application/json" aria-label="トレースの JSON">
  </div>
  <div id="result" class="banner" hidden></div>
  <div class="layout" id="layout" hidden>
    <div class="board" id="board"></div>
    <div class="side">
      <div class="now" id="now"></div>
      <ol class="log" id="log"></ol>
    </div>
  </div>
  <div class="controls" id="controls" hidden>
    <button id="first" aria-label="最初へ">⏮</button>
    <button id="prev" aria-label="1 手戻る">◀</button>
    <button id="play" aria-label="再生">▶ 再生</button>
    <button id="next" aria-label="1 手進む">▶|</button>
    <button id="last" aria-label="最後へ">⏭</button>
    <input type="range" id="scrub" min="0" value="0" aria-label="手の位置">
    <label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option></select></label>
  </div>
  <p class="note">このビューアにルールはありません。見えているものはすべて Lean のエンジン（<code>step</code>）が
    計算した結果の再生です。ただし、この描画のコードは Lean の証明の対象外です。</p>
</div>
<div id="fly"></div>
<script>
const EMBEDDED = /*__TRACE__*/null;
const $ = (id) => document.getElementById(id);
const PHASES = ['setup', 'awaken', 'beginning', 'channel', 'draw', 'main', 'ending'];
const PHASE_JA = { setup: '準備', awaken: 'Awaken', beginning: 'Beginning', channel: 'Channel', draw: 'Draw', main: 'Main', ending: 'Ending' };
const PILES = [['championZone', 'Champion'], ['mainDeck', 'Main Deck'], ['runeDeck', 'Rune Deck'], ['trash', 'Trash'],
  ['banishment', 'Banish'], ['setAside', '脇に置いた札'], ['outOfGame', 'ゲーム外']];
const LANES = [['legendZone', 'Legend'], ['base', 'Base'], ['hand', 'Hand']];
const DOMAINS = ['fury', 'calm', 'mind', 'body', 'chaos', 'order'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let trace, steps, cards, objs, cur = 0, playing = false, timer = null, speed = 1;
const els = new Map();        // object id -> card element
const zoneBox = new Map();    // zone name -> container element
const poolBox = [], pointsBox = [], seatBox = [];

function cardName(id) { const o = objs[id]; return o ? (cards[o.card] ? cards[o.card].name : o.card) : '#' + id; }
function dur() { return reduce ? 0 : 480 / speed; }

function load(t) {
  trace = t; steps = t.steps; cards = t.cards; objs = {};
  for (const s of steps) for (const [id, o] of Object.entries(s.state.new)) objs[id] = o;
  buildBoard(); buildLog();
  $('empty').hidden = true; $('layout').hidden = false; $('controls').hidden = false;
  $('scrub').max = steps.length - 1;
  show(0, false);
}

function buildBoard() {
  const board = $('board'); board.textContent = ''; els.clear(); zoneBox.clear();
  poolBox.length = pointsBox.length = seatBox.length = 0;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const seat = (p) => {
    const s = mk('section', 'seat'); seatBox[p] = s;
    const head = mk('div', 'seat-head'); head.append(mk('h2', '', 'P' + p));
    pointsBox[p] = mk('span', 'pts'); poolBox[p] = mk('div', 'pool'); head.append(pointsBox[p], poolBox[p]);
    const piles = mk('div', 'piles');
    for (const [k, label] of PILES) {
      const e = mk('div', 'pile'); e.append(mk('span', '', label), mk('b', '', '0'));
      zoneBox.set('p' + p + '.' + k, e); piles.append(e);
    }
    s.append(head, piles);
    for (const [k, label] of LANES) {
      const l = mk('div', 'lane'); l.dataset.label = label; zoneBox.set('p' + p + '.' + k, l); s.append(l);
    }
    return s;
  };
  board.append(seat(0));
  const bf = mk('div', 'lane'); bf.dataset.label = 'Battlefield'; zoneBox.set('battlefield', bf); board.append(bf);
  const ch = mk('div', 'lane'); ch.dataset.label = 'Chain'; zoneBox.set('chain', ch); board.append(ch);
  for (let p = 1; p < trace.players; p++) board.append(seat(p));
  const ph = $('phases'); ph.textContent = '';
  for (const k of PHASES) { const e = mk('span', 'phase', PHASE_JA[k]); e.dataset.phase = k; ph.append(e); }
}

function describe(i) {
  const s = steps[i], a = s.action;
  if (!a) return ['ゲーム開始前', '山札・Rune Deck・Battlefield の準備ができた状態'];
  const who = a.actor === 'chance' ? '乱数' : 'P' + a.actor.slice(1);
  switch (a.kind) {
    case 'arrange': return [who + ': 並び替え', 'シャッフル、または Recycle の順番'];
    case 'arrangePlayers': return [who + ': 手番順を決める', 'ターン順が決まった'];
    case 'pick': return [who + ': Battlefield を選ぶ', '抽選で Battlefield が場に出る'];
    case 'mulliganDone': return [who + ': マリガンしない', '手札を確定した'];
    case 'mulliganPick': return [who + ': マリガン', cardName(a.card) + ' を脇に置く'];
    case 'burnOutTarget': return [who + ': Burn Out の相手を選ぶ', 'P' + a.opponent + ' が 1 点を得る'];
    case 'pass':
      if (i > 0 && steps[i - 1].state.pending === 'chainPass') return [who + ': パス', 'Chain の呪文に応答しない（全員がパスすると解決する）'];
      return [who + ': パス', 'Main Phase を終えてターンを終える'];
    case 'runeAbility':
      if (a.ability === 'exhaust') return [who + ': ' + cardName(a.card) + ' を Exhaust', 'Energy +1'];
      return [who + ': ' + cardName(a.card) + ' を Recycle', (objs[a.card] && objs[a.card].rune || '') + ' Power +1、Rune Deck の下へ'];
    case 'playCard': {
      const o = objs[a.card], def = o && cards[o.card];
      if (def && def.types.includes('spell')) {
        const tg = (a.targets || []).map((t) => cardName(t)).join('、');
        return [who + ': ' + cardName(a.card) + ' をプレイ' + (tg ? '（対象: ' + tg + '）' : ''), 'コストを払って Chain に載せる'];
      }
      return [who + ': ' + cardName(a.card) + ' をプレイ', 'コストを払って Base に出す（Unit は Exhaust で入る）'];
    }
    default: return [who + ': ' + a.kind, ''];
  }
}

function buildLog() {
  const log = $('log'); log.textContent = '';
  steps.forEach((s, i) => {
    const li = document.createElement('li'); li.textContent = i + '. ' + describe(i)[0];
    li.addEventListener('click', () => { pause(); show(i, false); }); log.append(li);
  });
}

function rectOf(e) { const r = e.getBoundingClientRect(); return { left: r.left, top: r.top }; }

function visibleZones() {
  const z = [];
  for (let p = 0; p < trace.players; p++) for (const [k] of LANES) z.push('p' + p + '.' + k);
  z.push('battlefield', 'chain'); return z;
}

function makeCard(id) {
  const o = objs[id] || { card: '?', rune: null }, def = cards[o.card] || { name: o.card, types: [] };
  const el = document.createElement('div'); el.className = 'card'; el.dataset.id = id;
  const inn = document.createElement('div'); inn.className = 'card-in';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = def.name;
  inn.append(nm);
  if (def.types.includes('rune')) { el.classList.add('rune'); if (o.rune) inn.classList.add('d-' + o.rune); }
  else {
    const st = document.createElement('div'); st.className = 'st';
    const c = document.createElement('span'); c.textContent = def.cost != null ? def.cost : '';
    const m = document.createElement('span'); m.textContent = def.might != null ? def.might : '';
    st.append(c, m); inn.append(st);
    if (def.domains[0]) inn.classList.add('d-' + def.domains[0]);
  }
  el.append(inn); return el;
}

function zoneOfPrev(prevState, id) {
  for (const [z, l] of Object.entries(prevState.zones)) if (l.includes(id)) return z;
  return null;
}

function show(i, animate) {
  const prevI = cur, prev = steps[prevI].state, s = steps[i], st = s.state;
  animate = animate && !reduce && i === prevI + 1;
  const prevRects = new Map();
  if (animate) for (const [id, e] of els) prevRects.set(id, rectOf(e));
  const pileRect = (zone) => { const b = zoneBox.get(zone); return b ? rectOf(b) : null; };
  const events = animate ? s.events.filter((e) => e.t === 'moved') : [];
  const fromNew = new Map(events.map((e) => [e.new, e.old])), toDst = new Map(events.map((e) => [e.old, e.dst]));

  const want = new Set();
  for (const z of visibleZones()) for (const id of (st.zones[z] || [])) want.add(id);
  // objects that left the visible lanes
  for (const [id, e] of [...els]) {
    if (want.has(id)) continue;
    els.delete(id);
    const dst = toDst.get(id), dstRect = dst && !visibleZones().includes(dst) ? pileRect(dst) : null;
    if (animate && prevRects.has(id) && dstRect) fly(e, prevRects.get(id), dstRect);
    e.remove();
  }
  // lay out the lanes in order
  for (const z of visibleZones()) {
    const box = zoneBox.get(z); if (!box) continue;
    for (const id of (st.zones[z] || [])) {
      let e = els.get(id); if (!e) { e = makeCard(id); els.set(id, e); }
      box.append(e);
      e.firstChild.classList.toggle('exh', st.exhausted.includes(+id));
      let d = e.querySelector('.dmg'); const dm = st.damaged.find((x) => x[0] === +id);
      if (dm) { if (!d) { d = document.createElement('span'); d.className = 'dmg'; e.append(d); } d.textContent = dm[1]; } else if (d) d.remove();
    }
  }
  // animate what moved
  if (animate) for (const [id, e] of els) {
    const nr = rectOf(e); let from = null, fade = false;
    if (prevRects.has(id)) from = prevRects.get(id);
    else {
      const old = fromNew.get(id);
      if (old !== undefined && prevRects.has(old)) from = prevRects.get(old);
      else { const z = zoneOfPrev(prev, old !== undefined ? old : id); from = z ? pileRect(z) : null; fade = true; }
    }
    if (!from) { e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur() }); continue; }
    const dx = from.left - nr.left, dy = from.top - nr.top;
    if (!dx && !dy && !fade) continue;
    e.style.zIndex = 5;
    e.animate([{ transform: `translate(${dx}px,${dy}px)`, opacity: fade ? 0.2 : 1 }, { transform: 'translate(0,0)', opacity: 1 }],
      { duration: dur(), easing: 'cubic-bezier(.2,.8,.2,1)' }).finished.then(() => { e.style.zIndex = ''; }, () => {});
  }
  renderStatic(i, st, prev, animate);
  cur = i;
}

function fly(src, from, to) {
  const c = src.cloneNode(true); c.style.cssText = `position:fixed;left:${from.left}px;top:${from.top}px;margin:0`;
  $('fly').append(c);
  c.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${to.left - from.left}px,${to.top - from.top}px) scale(.6)`, opacity: 0.1 }],
    { duration: dur(), easing: 'ease-in' }).finished.then(() => c.remove(), () => c.remove());
}

function renderStatic(i, st, prev, animate) {
  $('status').textContent = `手 ${i}/${steps.length - 1} ・ ターン ${st.turn} ・ ${PHASE_JA[st.phase] || st.phase}`
    + (st.active !== null ? ` ・ P${st.active} の番` : '') + ` ・ seed ${trace.seed}`;
  document.querySelectorAll('.phase').forEach((e) => e.classList.toggle('on', e.dataset.phase === st.phase));
  seatBox.forEach((e, p) => e.classList.toggle('active', st.active === p));
  for (let p = 0; p < trace.players; p++) {
    pointsBox[p].textContent = st.points[p] + ' 点';
    const pool = st.pools[p], old = prev.pools[p], box = poolBox[p]; box.textContent = '';
    const add = (key, label) => {
      if (key !== 'energy' && !pool[key]) return;
      const c = document.createElement('span'); c.className = 'chip' + (key === 'energy' ? ' energy' : '');
      c.textContent = label + ' ' + pool[key];
      if (animate && pool[key] > old[key]) c.classList.add('pop');
      box.append(c);
    };
    add('energy', 'Energy'); for (const d of DOMAINS) add(d, d[0].toUpperCase() + d.slice(1));
    for (const [k] of PILES) {
      const e = zoneBox.get('p' + p + '.' + k), n = (st.zones['p' + p + '.' + k] || []).length;
      e.querySelector('b').textContent = n; e.classList.toggle('zero', n === 0);
    }
  }
  const [t, sub] = describe(i);
  $('now').textContent = ''; const b = document.createElement('b'); b.textContent = t;
  const sm = document.createElement('small'); sm.textContent = sub; $('now').append(b, sm);
  const mv = steps[i].events.length;
  if (mv) { const m = document.createElement('small'); m.textContent = ' ・ 移動 ' + mv + ' 枚'; $('now').append(m); }
  const r = $('result');
  if (st.result) { r.hidden = false; r.textContent = st.result === 'draw' ? '引き分け' : '勝者: P' + st.result.won.join(', P'); } else r.hidden = true;
  $('scrub').value = i;
  document.querySelectorAll('#log li').forEach((li, k) => li.classList.toggle('cur', k === i));
  const cl = document.querySelector('#log li.cur'), log = $('log');
  if (cl) log.scrollTop = Math.max(0, cl.offsetTop - log.clientHeight / 2);
}

function pause() { playing = false; clearTimeout(timer); $('play').textContent = '▶ 再生'; $('play').setAttribute('aria-label', '再生'); }
function play() {
  if (cur >= steps.length - 1) show(0, false);
  playing = true; $('play').textContent = '⏸ 停止'; $('play').setAttribute('aria-label', '停止'); tick();
}
function tick() {
  if (!playing) return;
  if (cur >= steps.length - 1) { pause(); return; }
  show(cur + 1, true);
  const s = steps[cur], busy = s.events.length > 0 || s.action && (s.action.kind === 'runeAbility' || s.action.kind === 'playCard') || s.action && s.action.kind === 'pass';
  timer = setTimeout(tick, (busy ? 800 : 160) / speed);
}

$('play').addEventListener('click', () => (playing ? pause() : play()));
$('next').addEventListener('click', () => { pause(); if (cur < steps.length - 1) show(cur + 1, true); });
$('prev').addEventListener('click', () => { pause(); if (cur > 0) show(cur - 1, false); });
$('first').addEventListener('click', () => { pause(); show(0, false); });
$('last').addEventListener('click', () => { pause(); show(steps.length - 1, false); });
$('scrub').addEventListener('input', (e) => { pause(); show(+e.target.value, false); });
$('speed').addEventListener('change', (e) => { speed = +e.target.value; });
document.addEventListener('keydown', (e) => {
  if (!steps || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click();
});
$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (f) load(JSON.parse(await f.text()));
});
if (EMBEDDED) load(EMBEDDED); else $('empty').hidden = false;
</script>
</body>
</html>
